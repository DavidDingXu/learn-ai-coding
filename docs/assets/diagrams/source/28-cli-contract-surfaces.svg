<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #fde68a; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 18px "SFMono-Regular", Menlo, Consolas, monospace; fill: #92400e; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">CLI 工具的可见契约</text>
  <text x="82" y="128" class="subtitle">看不见页面，不代表没有用户界面。命令行输出同样需要被验证。</text>

  <rect x="100" y="250" width="310" height="390" rx="20" class="card"/>
  <text x="140" y="315" class="label">输入契约</text>
  <text x="140" y="370" class="mono">command</text>
  <text x="140" y="410" class="mono">--root</text>
  <text x="140" y="450" class="mono">--file</text>
  <text x="140" y="510" class="small">参数缺失怎么处理</text>

  <rect x="470" y="250" width="310" height="390" rx="20" class="card"/>
  <text x="510" y="315" class="label">输出契约</text>
  <text x="510" y="370" class="mono"># Code Map</text>
  <text x="510" y="410" class="mono">Missing sections</text>
  <text x="510" y="450" class="mono">pass signal</text>
  <text x="510" y="510" class="small">读者能不能照着判断</text>

  <rect x="840" y="250" width="310" height="390" rx="20" class="card"/>
  <text x="880" y="315" class="label">退出契约</text>
  <text x="880" y="370" class="mono">0</text>
  <text x="880" y="410" class="mono">1</text>
  <text x="880" y="450" class="mono">stderr</text>
  <text x="880" y="510" class="small">CI 能不能识别失败</text>

  <rect x="1210" y="250" width="310" height="390" rx="20" class="card"/>
  <text x="1250" y="315" class="label">文档契约</text>
  <text x="1250" y="370" class="mono">README</text>
  <text x="1250" y="410" class="mono">examples</text>
  <text x="1250" y="450" class="mono">commands</text>
  <text x="1250" y="510" class="small">命令是否真的可跑</text>
</svg>
