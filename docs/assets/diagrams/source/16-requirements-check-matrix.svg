<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; filter: url(#shadow); }
      .head { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
      .text { font: 400 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">requirements 检查矩阵</text>
  <text x="82" y="128" class="subtitle">需求合同写完后，先确认它能变成测试和边界约束。</text>

  <rect x="150" y="220" width="560" height="230" rx="24" class="card"/>
  <text x="210" y="290" class="head">行为具体</text>
  <text x="210" y="340" class="text">能说清前置状态、动作和结果</text>
  <text x="210" y="385" class="small">避免“优化”“正确处理”“体验更好”</text>

  <rect x="890" y="220" width="560" height="230" rx="24" class="card"/>
  <text x="950" y="290" class="head">旧行为保留</text>
  <text x="950" y="340" class="text">说明哪些路径必须保持原样</text>
  <text x="950" y="385" class="small">pending、shipped、旧接口、历史兼容</text>

  <rect x="150" y="540" width="560" height="230" rx="24" class="card"/>
  <text x="210" y="610" class="head">异常路径覆盖</text>
  <text x="210" y="660" class="text">失败、重复、并发、外部服务不可用</text>
  <text x="210" y="705" class="small">不要只写 happy path</text>

  <rect x="890" y="540" width="560" height="230" rx="24" class="card"/>
  <text x="950" y="610" class="head">非目标明确</text>
  <text x="950" y="660" class="text">写清本次不改什么</text>
  <text x="950" y="705" class="small">防止 Agent 顺手扩大范围</text>
</svg>
