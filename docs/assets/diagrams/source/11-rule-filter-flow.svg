<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .q { fill: #ffffff; stroke: #99f6e4; stroke-width: 2; filter: url(#shadow); }
      .yes { fill: #dcfce7; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .no { fill: #fee2e2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .qTitle { font: 700 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .yesTitle { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
      .noTitle { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #991b1b; }
      .line { stroke: #0f766e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">规则应该放在哪里</text>
  <text x="82" y="128" class="subtitle">写进项目规则前，先判断它是不是长期、可执行、可验证的 Agent 约束。</text>

  <rect x="160" y="230" width="250" height="120" rx="18" class="q"/>
  <text x="198" y="280" class="qTitle">长期有效吗？</text>
  <text x="198" y="318" class="text">不是单次任务背景</text>

  <rect x="500" y="230" width="250" height="120" rx="18" class="q"/>
  <text x="538" y="280" class="qTitle">能执行吗？</text>
  <text x="538" y="318" class="text">有明确动作</text>

  <rect x="840" y="230" width="250" height="120" rx="18" class="q"/>
  <text x="878" y="280" class="qTitle">能验证吗？</text>
  <text x="878" y="318" class="text">能通过 diff 或命令检查</text>

  <rect x="1180" y="230" width="250" height="120" rx="18" class="q"/>
  <text x="1218" y="280" class="qTitle">减少真实风险吗？</text>
  <text x="1218" y="318" class="text">来自高频问题或事故</text>

  <path d="M 410 290 L 500 290" class="line"/>
  <path d="M 750 290 L 840 290" class="line"/>
  <path d="M 1090 290 L 1180 290" class="line"/>
  <text x="442" y="272" class="label">是</text>
  <text x="782" y="272" class="label">是</text>
  <text x="1122" y="272" class="label">是</text>

  <rect x="1030" y="560" width="360" height="130" rx="20" class="yes"/>
  <text x="1108" y="615" class="yesTitle">写进项目规则</text>
  <text x="1082" y="654" class="text">AGENTS.md / CLAUDE.md / repo instructions</text>

  <rect x="210" y="560" width="420" height="130" rx="20" class="no"/>
  <text x="300" y="615" class="noTitle">换位置</text>
  <text x="258" y="654" class="text">任务上下文、代码地图、docs、issue 或 PR</text>

  <path d="M 1305 350 C 1300 450, 1260 520, 1210 560" class="line"/>
  <path d="M 285 350 C 285 440, 330 515, 420 560" class="line"/>
  <path d="M 625 350 C 610 440, 540 520, 420 560" class="line"/>
  <path d="M 965 350 C 900 455, 710 535, 630 590" class="line"/>
</svg>
