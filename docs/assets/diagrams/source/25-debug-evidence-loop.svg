<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f46e5"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #c7d2fe; stroke-width: 2; filter: url(#shadow); }
      .fix { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .stop { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 19px "SFMono-Regular", Menlo, Consolas, monospace; fill: #3730a3; }
      .edge { stroke: #4f46e5; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">系统化调试：先证据，再修复</text>
  <text x="82" y="128" class="subtitle">不要让 AI 直接猜原因。每一轮只验证一个假设。</text>

  <rect x="110" y="260" width="245" height="150" rx="18" class="node"/>
  <text x="150" y="315" class="label">复现</text>
  <text x="150" y="355" class="small">命令、输入、环境</text>

  <rect x="465" y="215" width="270" height="220" rx="18" class="node"/>
  <text x="505" y="275" class="label">收集证据</text>
  <text x="505" y="318" class="small">错误、日志、diff</text>
  <text x="505" y="353" class="small">调用链、数据流</text>
  <text x="505" y="388" class="mono">no fix yet</text>

  <rect x="845" y="230" width="280" height="190" rx="18" class="node"/>
  <text x="885" y="290" class="label">形成单一假设</text>
  <text x="885" y="332" class="small">我认为 X 导致 Y</text>
  <text x="885" y="367" class="small">证据是什么</text>

  <rect x="1240" y="260" width="260" height="150" rx="18" class="node"/>
  <text x="1280" y="315" class="label">最小验证</text>
  <text x="1280" y="355" class="small">只改一个变量</text>

  <rect x="835" y="575" width="300" height="155" rx="18" class="fix"/>
  <text x="878" y="630" class="label">修根因</text>
  <text x="878" y="672" class="small">失败用例变绿</text>
  <text x="878" y="704" class="small">回归测试通过</text>

  <rect x="465" y="565" width="270" height="175" rx="18" class="stop"/>
  <text x="505" y="620" class="label">假设失败</text>
  <text x="505" y="662" class="small">回到证据</text>
  <text x="505" y="697" class="small">不要叠加补丁</text>

  <path d="M355 335 C395 335, 425 335, 465 335" class="edge"/>
  <path d="M735 325 C780 325, 800 325, 845 325" class="edge"/>
  <path d="M1125 325 C1165 325, 1200 325, 1240 325" class="edge"/>
  <path d="M1370 410 C1325 540, 1215 640, 1135 650" class="edge"/>
  <path d="M845 650 C805 650, 775 650, 735 650" class="edge"/>
  <path d="M600 565 C600 510, 600 485, 600 435" class="edge"/>
</svg>
