<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #c7d2fe; stroke-width: 2; filter: url(#shadow); }
      .box2 { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; filter: url(#shadow); }
      .box3 { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 600 21px "SFMono-Regular", Menlo, Consolas, monospace; fill: #1e293b; }
      .cmd { font: 700 22px "SFMono-Regular", Menlo, Consolas, monospace; fill: #1d4ed8; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 3; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">OpenSpec 把一次需求变更放进 repo</text>
  <text x="82" y="128" class="subtitle">当前行为放在 specs，拟议变更放在 changes，完成后再归档合并。</text>

  <rect x="90" y="210" width="360" height="420" rx="18" class="box"/>
  <text x="125" y="270" class="label">openspec/specs/</text>
  <text x="125" y="315" class="small">系统当前行为</text>
  <text x="125" y="350" class="small">按领域组织</text>
  <text x="125" y="395" class="mono">specs/auth/spec.md</text>
  <text x="125" y="430" class="mono">specs/order/spec.md</text>
  <text x="125" y="465" class="mono">specs/payment/spec.md</text>
  <rect x="125" y="520" width="290" height="70" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="150" y="565" class="small">Agent 先读这里理解旧行为</text>

  <rect x="620" y="190" width="390" height="490" rx="18" class="box2"/>
  <text x="655" y="250" class="label">openspec/changes/</text>
  <text x="655" y="292" class="mono">&lt;change-name&gt;/</text>
  <rect x="660" y="330" width="310" height="58" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="685" y="367" class="mono">proposal.md</text>
  <rect x="660" y="405" width="310" height="58" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="685" y="442" class="mono">specs/**/spec.md</text>
  <rect x="660" y="480" width="310" height="58" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="685" y="517" class="mono">design.md</text>
  <rect x="660" y="555" width="310" height="58" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="685" y="592" class="mono">tasks.md</text>
  <text x="655" y="650" class="small">每个变更一个文件夹，先隔离再合并</text>

  <rect x="1170" y="225" width="320" height="375" rx="18" class="box3"/>
  <text x="1205" y="285" class="label">Agent 执行路径</text>
  <text x="1208" y="337" class="cmd">/opsx:propose</text>
  <text x="1208" y="390" class="cmd">/opsx:apply</text>
  <text x="1208" y="443" class="cmd">/opsx:sync</text>
  <text x="1208" y="496" class="cmd">/opsx:archive</text>
  <text x="1208" y="555" class="small">扩展 profile 可启用更多命令</text>

  <path d="M 450 400 C 520 360, 555 345, 620 345" class="arrow"/>
  <path d="M 1010 420 C 1080 405, 1100 395, 1170 395" class="arrow"/>
  <path d="M 1180 610 C 1000 785, 580 790, 365 635" class="dash"/>
  <text x="560" y="785" class="small">archive 后：delta spec 合入 specs，change 进入 archive 历史记录</text>
</svg>
