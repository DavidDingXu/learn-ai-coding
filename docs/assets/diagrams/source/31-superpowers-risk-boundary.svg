<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #fecaca; stroke-width: 2; filter: url(#shadow); }
      .good { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; }
      .bad { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; }
      .label { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .ok { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #15803d; }
      .x { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Superpowers 解决的是流程漂移，不是替你判断业务</text>
  <text x="82" y="128" class="subtitle">用它约束阶段和证据，但不要把 Skill 链当成自动正确。</text>

  <rect x="110" y="210" width="635" height="560" rx="18" class="panel"/>
  <text x="155" y="270" class="label">适合交给 Skill 链约束</text>
  <rect x="155" y="330" width="540" height="74" rx="12" class="good"/>
  <text x="185" y="378" class="ok">✓</text>
  <text x="225" y="378" class="small">先澄清，再设计，再计划</text>
  <rect x="155" y="425" width="540" height="74" rx="12" class="good"/>
  <text x="185" y="473" class="ok">✓</text>
  <text x="225" y="473" class="small">每个任务有文件、步骤、命令</text>
  <rect x="155" y="520" width="540" height="74" rx="12" class="good"/>
  <text x="185" y="568" class="ok">✓</text>
  <text x="225" y="568" class="small">TDD、debug、review、verification 的顺序</text>
  <rect x="155" y="615" width="540" height="74" rx="12" class="good"/>
  <text x="185" y="663" class="ok">✓</text>
  <text x="225" y="663" class="small">完成前必须有新鲜验证证据</text>

  <rect x="855" y="210" width="635" height="560" rx="18" class="panel"/>
  <text x="900" y="270" class="label">仍然需要程序员判断</text>
  <rect x="900" y="330" width="540" height="74" rx="12" class="bad"/>
  <text x="930" y="378" class="x">×</text>
  <text x="970" y="378" class="small">需求本身是否正确</text>
  <rect x="900" y="425" width="540" height="74" rx="12" class="bad"/>
  <text x="930" y="473" class="x">×</text>
  <text x="970" y="473" class="small">架构取舍是否值得</text>
  <rect x="900" y="520" width="540" height="74" rx="12" class="bad"/>
  <text x="930" y="568" class="x">×</text>
  <text x="970" y="568" class="small">测试是否覆盖真实业务风险</text>
  <rect x="900" y="615" width="540" height="74" rx="12" class="bad"/>
  <text x="930" y="663" class="x">×</text>
  <text x="970" y="663" class="small">残余风险是否可接受</text>
</svg>
