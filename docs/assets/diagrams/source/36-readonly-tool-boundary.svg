<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">只读项目工具：先收紧边界，再考虑 MCP</text>
  <text x="80" y="124" font-family="Arial, sans-serif" font-size="18" fill="#64748b">context-pack 只读取仓库文件并输出 Markdown，不写文件、不跑命令、不访问网络</text>

  <rect x="90" y="200" width="330" height="450" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">输入</text>
  <rect x="130" y="295" width="240" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="154" y="329" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">--title</text>
  <rect x="130" y="370" width="240" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="154" y="404" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">--files</text>
  <rect x="130" y="445" width="240" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="154" y="479" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">--constraints</text>
  <rect x="130" y="520" width="240" height="54" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="154" y="554" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">--done</text>

  <rect x="520" y="170" width="560" height="510" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="225" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">context-pack</text>
  <text x="560" y="263" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">组合已有能力，不引入新权限</text>
  <rect x="570" y="315" width="420" height="62" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="600" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">createTaskContext</text>
  <rect x="570" y="405" width="420" height="62" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="600" y="444" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">buildCodeMap</text>
  <rect x="570" y="495" width="420" height="62" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="600" y="534" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">render Markdown to stdout</text>

  <rect x="1180" y="200" width="330" height="450" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1220" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2937">输出</text>
  <rect x="1220" y="300" width="240" height="58" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1244" y="336" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">Read-Only Boundary</text>
  <rect x="1220" y="382" width="240" height="58" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1244" y="418" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">Task Context</text>
  <rect x="1220" y="464" width="240" height="58" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1244" y="500" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">Code Map</text>
  <rect x="1220" y="546" width="240" height="58" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1244" y="582" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">Verification Handoff</text>

  <path d="M420 425 L520 425" stroke="#64748b" stroke-width="4" marker-end="url(#a36)"/>
  <path d="M1080 425 L1180 425" stroke="#64748b" stroke-width="4" marker-end="url(#a36)"/>

  <rect x="230" y="725" width="1140" height="86" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="270" y="777" font-family="Arial, sans-serif" font-size="20" fill="#374151">如果这个工具需要被多个 AI 客户端发现、授权和调用，再把它包装成 MCP server。</text>

  <defs>
    <marker id="a36" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
