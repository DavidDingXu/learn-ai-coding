<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <rect width="2560" height="1440" fill="#f7f8fb"/>
  <rect x="120" y="96" width="2320" height="1248" rx="32" fill="#ffffff" stroke="#d8dee9" stroke-width="3"/>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#111827">程序员 AI Coding 学习路线</text>
  <text x="180" y="238" font-family="Arial, sans-serif" font-size="30" fill="#4b5563">目标不是多会几个工具，而是把真实改动做成可审查、可验证、可复用的工程流程。</text>

  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="180" y="340" width="300" height="170" rx="18" fill="#e8f1ff" stroke="#8bb8ff" stroke-width="3"/>
    <text x="220" y="404" font-size="36" font-weight="700" fill="#0f3f7a">1. 任务判断</text>
    <text x="220" y="462" font-size="26" fill="#1f2937">先判断能否交给 AI</text>
    <text x="220" y="498" font-size="24" fill="#4b5563">风险 / 边界 / 人工点</text>

    <rect x="600" y="340" width="300" height="170" rx="18" fill="#e9f8ef" stroke="#7dcf99" stroke-width="3"/>
    <text x="640" y="404" font-size="36" font-weight="700" fill="#116536">2. 主工作面</text>
    <text x="640" y="462" font-size="26" fill="#1f2937">按证据链选入口</text>
    <text x="640" y="498" font-size="24" fill="#4b5563">工具可换，边界不丢</text>

    <rect x="1020" y="340" width="300" height="170" rx="18" fill="#fff7df" stroke="#efc75e" stroke-width="3"/>
    <text x="1060" y="404" font-size="36" font-weight="700" fill="#7a4b00">3. 上下文</text>
    <text x="1060" y="462" font-size="26" fill="#1f2937">给对文件和规则</text>
    <text x="1060" y="498" font-size="24" fill="#4b5563">代码地图 / 上下文包</text>

    <rect x="1440" y="340" width="300" height="170" rx="18" fill="#f2ebff" stroke="#b69bff" stroke-width="3"/>
    <text x="1480" y="404" font-size="36" font-weight="700" fill="#4c1d95">4. 规格驱动</text>
    <text x="1480" y="462" font-size="26" fill="#1f2937">复杂需求先写 spec</text>
    <text x="1480" y="498" font-size="24" fill="#4b5563">requirements / design / tasks</text>

    <rect x="1860" y="340" width="300" height="170" rx="18" fill="#ffecec" stroke="#f5a0a0" stroke-width="3"/>
    <text x="1900" y="404" font-size="36" font-weight="700" fill="#991b1b">5. 小步实现</text>
    <text x="1900" y="462" font-size="26" fill="#1f2937">限制 diff 范围</text>
    <text x="1900" y="498" font-size="24" fill="#4b5563">计划先行 / 逐步落地</text>

    <line x1="500" y1="425" x2="575" y2="425" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="920" y1="425" x2="995" y2="425" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="1340" y1="425" x2="1415" y2="425" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="1760" y1="425" x2="1835" y2="425" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="390" y="720" width="360" height="180" rx="18" fill="#e9fbfb" stroke="#62c7c7" stroke-width="3"/>
    <text x="430" y="784" font-size="36" font-weight="700" fill="#0f6666">6. 测试调试</text>
    <text x="430" y="842" font-size="26" fill="#1f2937">用证据约束 AI</text>
    <text x="430" y="878" font-size="24" fill="#4b5563">baseline / 日志 / 复现</text>

    <rect x="930" y="720" width="360" height="180" rx="18" fill="#f0fdf4" stroke="#74c889" stroke-width="3"/>
    <text x="970" y="784" font-size="36" font-weight="700" fill="#166534">7. 工作流固化</text>
    <text x="970" y="842" font-size="26" fill="#1f2937">经验写进规则</text>
    <text x="970" y="878" font-size="24" fill="#4b5563">Skill / 检查清单</text>

    <rect x="1470" y="720" width="360" height="180" rx="18" fill="#fff1f2" stroke="#f2a0aa" stroke-width="3"/>
    <text x="1510" y="784" font-size="36" font-weight="700" fill="#9f1239">8. 综合实战</text>
    <text x="1510" y="842" font-size="26" fill="#1f2937">串起完整链路</text>
    <text x="1510" y="878" font-size="24" fill="#4b5563">复盘 / 资产沉淀</text>

    <line x1="2010" y1="535" x2="2010" y2="620" stroke="#475569" stroke-width="5"/>
    <line x1="2010" y1="620" x2="570" y2="620" stroke="#475569" stroke-width="5"/>
    <line x1="570" y1="620" x2="570" y2="695" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="750" y1="810" x2="905" y2="810" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="1290" y1="810" x2="1445" y2="810" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="330" y="1040" width="1900" height="165" rx="18" fill="#111827"/>
    <text x="390" y="1106" font-size="34" font-weight="700" fill="#ffffff">每个阶段都要留下可检查产物</text>
    <text x="390" y="1162" font-size="28" fill="#d1d5db">任务风险表  ·  主工作面判断表  ·  代码地图  ·  spec/design/tasks  ·  小 diff  ·  测试与验证记录  ·  个人规则库</text>
  </g>
</svg>
