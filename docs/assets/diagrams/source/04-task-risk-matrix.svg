<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .axis { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .quadTitle { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .note { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
      .frame { fill: #ffffff; stroke: #d1d5db; stroke-width: 2; filter: url(#shadow); }
      .q1 { fill: #dcfce7; }
      .q2 { fill: #fef9c3; }
      .q3 { fill: #e0f2fe; }
      .q4 { fill: #fee2e2; }
      .line { stroke: #64748b; stroke-width: 3; }
      .badge { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">AI Coding 任务风险分级矩阵</text>
  <text x="82" y="128" class="subtitle">任务是否适合 AI 主导，取决于验证信号和影响范围，不取决于代码量。</text>

  <rect x="190" y="190" width="1220" height="570" rx="22" class="frame"/>
  <rect x="210" y="210" width="590" height="265" rx="12" class="q3"/>
  <rect x="800" y="210" width="590" height="265" rx="12" class="q4"/>
  <rect x="210" y="475" width="590" height="265" rx="12" class="q1"/>
  <rect x="800" y="475" width="590" height="265" rx="12" class="q2"/>
  <line x1="800" y1="210" x2="800" y2="740" class="line"/>
  <line x1="210" y1="475" x2="1390" y2="475" class="line"/>

  <text x="330" y="175" class="axis">验证信号弱</text>
  <text x="1115" y="175" class="axis">验证信号强</text>
  <text x="50" y="315" class="axis" transform="rotate(-90 50 315)">影响范围大 / 风险高</text>
  <text x="50" y="720" class="axis" transform="rotate(-90 50 720)">影响范围小 / 风险低</text>

  <text x="250" y="270" class="quadTitle">AI 辅助探索</text>
  <text x="250" y="320" class="text">适合读代码、列假设、找入口</text>
  <text x="250" y="356" class="text">不适合直接实现</text>
  <text x="250" y="402" class="small">例：历史兼容逻辑、性能瓶颈、复杂重构方案</text>

  <text x="850" y="270" class="quadTitle">人控计划，AI 分步做</text>
  <text x="850" y="320" class="text">有验证，但影响面较大</text>
  <text x="850" y="356" class="text">必须拆成小 diff</text>
  <text x="850" y="402" class="small">例：跨文件改造、框架迁移、接口字段同步</text>

  <text x="250" y="535" class="quadTitle">先补验证，再授权</text>
  <text x="250" y="585" class="text">范围不大，但缺少检查信号</text>
  <text x="250" y="621" class="text">先补截图、用例或人工检查点</text>
  <text x="250" y="667" class="small">例：局部 UI 调整、文案规则、轻量脚本行为</text>

  <text x="850" y="535" class="quadTitle">AI 主导，人审证据</text>
  <text x="850" y="585" class="text">目标清楚、范围小、能验证</text>
  <text x="850" y="621" class="text">适合直接执行并报告 diff</text>
  <text x="850" y="667" class="small">例：测试补充、局部 bug、已有模式下新增字段</text>

  <rect x="1050" y="780" width="360" height="62" rx="31" class="badge"/>
  <text x="1090" y="819" class="note">授权级别随风险动态调整</text>
</svg>
