<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; filter: url(#shadow); }
      .red { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .green { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 20px "SFMono-Regular", Menlo, Consolas, monospace; fill: #166534; }
      .edge { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">TDD + AI Coding：先让测试约束模型</text>
  <text x="82" y="128" class="subtitle">失败测试不是坏结果，它是把自然语言需求变成可执行合同。</text>

  <rect x="90" y="300" width="290" height="155" rx="18" class="node"/>
  <text x="130" y="360" class="label">需求场景</text>
  <text x="130" y="402" class="small">paid cancel → refund_requested</text>

  <rect x="500" y="245" width="300" height="230" rx="18" class="red"/>
  <text x="545" y="305" class="label">Red</text>
  <text x="545" y="350" class="small">只写失败测试</text>
  <text x="545" y="385" class="small">不改实现</text>
  <text x="545" y="420" class="mono">npm test -- order-cancel</text>

  <rect x="910" y="245" width="300" height="230" rx="18" class="green"/>
  <text x="955" y="305" class="label">Green</text>
  <text x="955" y="350" class="small">最小实现让测试通过</text>
  <text x="955" y="385" class="small">不做顺手重构</text>
  <text x="955" y="420" class="mono">focused tests pass</text>

  <rect x="500" y="595" width="300" height="145" rx="18" class="node"/>
  <text x="545" y="650" class="label">Review</text>
  <text x="545" y="692" class="small">测试是否真的锁需求</text>

  <rect x="910" y="575" width="300" height="185" rx="18" class="node"/>
  <text x="955" y="630" class="label">Refactor 可选</text>
  <text x="955" y="672" class="small">行为已被测试锁住</text>
  <text x="955" y="707" class="small">单独授权，单独验证</text>

  <rect x="1290" y="300" width="230" height="155" rx="18" class="node"/>
  <text x="1325" y="360" class="label">扩大验证</text>
  <text x="1325" y="402" class="small">module / integration</text>

  <path d="M380 378 C425 378, 455 378, 500 378" class="edge"/>
  <path d="M800 360 C845 360, 865 360, 910 360" class="edge"/>
  <path d="M1060 475 C1040 530, 1010 550, 975 575" class="edge"/>
  <path d="M910 665 C850 665, 840 665, 800 665" class="edge"/>
  <path d="M650 595 C650 540, 650 515, 650 475" class="edge"/>
  <path d="M1210 360 C1240 360, 1260 360, 1290 360" class="edge"/>
</svg>
