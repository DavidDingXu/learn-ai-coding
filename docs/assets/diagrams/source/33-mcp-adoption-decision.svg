<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; filter: url(#shadow); }
      .no { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .risk { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .edge { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .edge-gray { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .tag { font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">MCP 接入决策</text>
  <text x="82" y="128" class="subtitle">只有当外部资源高频、稳定、可授权、可验证时，才值得接成工具。</text>

  <rect x="105" y="285" width="260" height="150" rx="18" class="node"/>
  <text x="137" y="342" class="label">资源是否在 repo 外？</text>
  <text x="137" y="385" class="small">文档、Issue、日志、浏览器</text>

  <rect x="485" y="190" width="260" height="150" rx="18" class="no"/>
  <text x="520" y="247" class="label">否</text>
  <text x="520" y="290" class="small">先用文件、rg、CLI</text>

  <rect x="485" y="410" width="260" height="150" rx="18" class="node"/>
  <text x="520" y="467" class="label">是否高频重复？</text>
  <text x="520" y="510" class="small">每周都要查同类资源</text>

  <rect x="875" y="190" width="270" height="150" rx="18" class="no"/>
  <text x="910" y="247" class="label">否</text>
  <text x="910" y="290" class="small">临时命令或手工查询</text>

  <rect x="875" y="410" width="270" height="150" rx="18" class="node"/>
  <text x="910" y="467" class="label">权限能否收窄？</text>
  <text x="910" y="510" class="small">只读、白名单、审批</text>

  <rect x="1265" y="190" width="250" height="150" rx="18" class="risk"/>
  <text x="1300" y="247" class="label">不能</text>
  <text x="1300" y="290" class="small">不要接入 Agent</text>

  <rect x="1265" y="410" width="250" height="150" rx="18" class="node"/>
  <text x="1300" y="467" class="label">可以</text>
  <text x="1300" y="510" class="small">接 MCP 并留证据</text>

  <rect x="875" y="665" width="640" height="110" rx="18" class="risk"/>
  <text x="915" y="722" class="label">接入后还要有 Skill / 项目规则约束“怎么用”</text>
  <text x="915" y="758" class="small">MCP 只提供访问能力，不替代工程判断和验证流程。</text>

  <path d="M365 338 C420 300, 435 265, 485 265" class="edge-gray"/>
  <text x="400" y="278" class="tag">否</text>
  <path d="M365 382 C420 430, 435 485, 485 485" class="edge"/>
  <text x="402" y="455" class="tag">是</text>
  <path d="M745 465 C805 415, 820 275, 875 265" class="edge-gray"/>
  <text x="790" y="335" class="tag">否</text>
  <path d="M745 485 C805 485, 820 485, 875 485" class="edge"/>
  <text x="790" y="470" class="tag">是</text>
  <path d="M1145 465 C1205 410, 1215 275, 1265 265" class="edge-gray"/>
  <text x="1190" y="335" class="tag">否</text>
  <path d="M1145 485 C1205 485, 1215 485, 1265 485" class="edge"/>
  <text x="1190" y="470" class="tag">是</text>
  <path d="M1390 560 C1390 620, 1290 665, 1195 665" class="edge"/>
</svg>
