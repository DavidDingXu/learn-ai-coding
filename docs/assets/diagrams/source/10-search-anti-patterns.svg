<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .bad { fill: #fee2e2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .good { fill: #dcfce7; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .headBad { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #991b1b; }
      .headGood { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
      .item { font: 400 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .code { font: 500 19px Menlo, Monaco, Consolas, monospace; fill: #0f172a; }
      .divider { stroke: #cbd5e1; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">代码搜索误区对照</text>
  <text x="82" y="128" class="subtitle">同样是搜索，差别在于是否把输出整理成可验证上下文。</text>

  <rect x="100" y="190" width="650" height="570" rx="24" class="bad"/>
  <rect x="850" y="190" width="650" height="570" rx="24" class="good"/>
  <line x1="800" y1="190" x2="800" y2="760" class="divider"/>

  <text x="150" y="250" class="headBad">错误搜法</text>
  <text x="900" y="250" class="headGood">工程化搜法</text>

  <text x="150" y="320" class="item">只搜用户原话</text>
  <text x="150" y="370" class="item">只读第一个命中文件</text>
  <text x="150" y="420" class="item">只看实现，不看测试</text>
  <text x="150" y="470" class="item">只看定义，不看调用点</text>
  <text x="150" y="520" class="item">只说“我搜过了”</text>
  <text x="150" y="590" class="code">rg -n "提交失败" .</text>

  <text x="900" y="320" class="item">先把用户语言翻译成代码词表</text>
  <text x="900" y="370" class="item">区分生产、测试、demo、legacy</text>
  <text x="900" y="420" class="item">测试文件作为上下文的一部分</text>
  <text x="900" y="470" class="item">沿调用点确认真实路径</text>
  <text x="900" y="520" class="item">整理成 Search Summary</text>
  <text x="900" y="590" class="code">rg -n "submit|401|refresh|token" src test</text>
</svg>
