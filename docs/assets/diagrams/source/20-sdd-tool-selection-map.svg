<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .tag { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .axis { stroke: #64748b; stroke-width: 3; }
      .axisLabel { font: 600 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">SDD 工具选择不是按名气，而是按任务形态</text>
  <text x="82" y="128" class="subtitle">一次性小变更、长期行为合同、完整 SDD 工作流，对应三种不同成本。</text>

  <line x1="190" y1="760" x2="1410" y2="760" class="axis"/>
  <line x1="190" y1="760" x2="190" y2="210" class="axis"/>
  <text x="600" y="825" class="axisLabel">变更寿命与复用价值：低 → 高</text>
  <text x="38" y="535" class="axisLabel" transform="rotate(-90 38 535)">流程结构与工具介入：轻 → 重</text>

  <rect x="260" y="565" width="330" height="150" rx="18" class="card" stroke="#93c5fd"/>
  <text x="300" y="615" class="label">轻量 SDD</text>
  <text x="300" y="660" class="small">临时规格目录</text>
  <text x="300" y="695" class="small">requirements / design / tasks</text>

  <rect x="650" y="395" width="360" height="185" rx="18" class="card" stroke="#86efac"/>
  <text x="690" y="445" class="label">OpenSpec</text>
  <text x="690" y="490" class="small">当前 specs + 拟议 changes</text>
  <text x="690" y="525" class="small">delta spec 归档后合并</text>
  <text x="690" y="560" class="small">适合反复变化的存量系统</text>

  <rect x="1070" y="245" width="360" height="210" rx="18" class="card" stroke="#c4b5fd"/>
  <text x="1110" y="295" class="label">Spec Kit</text>
  <text x="1110" y="340" class="small">constitution / specify / plan</text>
  <text x="1110" y="375" class="small">tasks / analyze / implement</text>
  <text x="1110" y="410" class="small">适合完整 SDD 流程和多 Agent 集成</text>

  <rect x="260" y="210" width="330" height="86" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="300" y="263" class="tag" fill="#1d4ed8">小、快、一次性</text>
  <rect x="650" y="210" width="360" height="86" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="690" y="263" class="tag" fill="#15803d">旧行为不能靠猜</text>
  <rect x="1070" y="510" width="360" height="86" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="1110" y="563" class="tag" fill="#6d28d9">需要工具链管完整过程</text>
</svg>
