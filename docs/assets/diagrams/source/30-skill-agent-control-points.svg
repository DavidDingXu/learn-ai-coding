<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0891b2"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #a5f3fc; stroke-width: 2; filter: url(#shadow); }
      .gate { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 18px "SFMono-Regular", Menlo, Consolas, monospace; fill: #155e75; }
      .edge { stroke: #0891b2; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Skill 约束 Agent 的 5 个控制点</text>
  <text x="82" y="128" class="subtitle">它不能保证正确，但能把随意行动变成有触发、有步骤、有证据的执行。</text>

  <rect x="95" y="285" width="235" height="145" rx="18" class="node"/>
  <text x="130" y="340" class="label">触发条件</text>
  <text x="130" y="380" class="small">何时必须使用</text>

  <rect x="420" y="245" width="250" height="225" rx="18" class="node"/>
  <text x="460" y="305" class="label">上下文入口</text>
  <text x="460" y="347" class="small">先读什么</text>
  <text x="460" y="382" class="small">不要读什么</text>
  <text x="460" y="417" class="mono">references/</text>

  <rect x="760" y="245" width="250" height="225" rx="18" class="gate"/>
  <text x="800" y="305" class="label">流程门禁</text>
  <text x="800" y="347" class="small">先计划再实现</text>
  <text x="800" y="382" class="small">先红灯再绿灯</text>
  <text x="800" y="417" class="small">先证据再声明</text>

  <rect x="1100" y="245" width="250" height="225" rx="18" class="node"/>
  <text x="1140" y="305" class="label">工具和脚本</text>
  <text x="1140" y="347" class="small">确定性校验</text>
  <text x="1140" y="382" class="small">生成、检查、转换</text>
  <text x="1140" y="417" class="mono">scripts/</text>

  <rect x="610" y="600" width="370" height="145" rx="18" class="node"/>
  <text x="650" y="655" class="label">输出约束</text>
  <text x="650" y="697" class="small">文件、证据、风险、下一步</text>

  <path d="M330 357 C365 357, 385 357, 420 357" class="edge"/>
  <path d="M670 357 C705 357, 725 357, 760 357" class="edge"/>
  <path d="M1010 357 C1045 357, 1065 357, 1100 357" class="edge"/>
  <path d="M1225 470 C1120 580, 990 655, 980 672" class="edge"/>
  <path d="M760 672 C690 590, 615 510, 545 470" class="edge"/>
</svg>
