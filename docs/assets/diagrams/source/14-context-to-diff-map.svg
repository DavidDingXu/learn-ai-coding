<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; filter: url(#shadow); }
      .warn { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 17px "SFMono-Regular", Menlo, Consolas, monospace; fill: #166534; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">任务上下文包如何限制 diff</text>
  <text x="82" y="128" class="subtitle">把“先读什么、不能改什么、做到什么程度”写清，AI 才不容易扩散。</text>

  <rect x="95" y="240" width="320" height="430" rx="20" class="card"/>
  <text x="135" y="305" class="label">必须先读</text>
  <text x="135" y="360" class="mono">README.md</text>
  <text x="135" y="400" class="mono">src/cli.js</text>
  <text x="135" y="440" class="mono">src/lib/codemap.js</text>
  <text x="135" y="480" class="mono">test/codemap.test.js</text>
  <text x="135" y="560" class="small">决定能不能改</text>

  <rect x="495" y="240" width="320" height="430" rx="20" class="warn"/>
  <text x="535" y="305" class="label">不能越界</text>
  <text x="535" y="360" class="small">不引入 AST 解析</text>
  <text x="535" y="400" class="small">不改 CLI 契约</text>
  <text x="535" y="440" class="small">不扩大到业务功能</text>
  <text x="535" y="480" class="small">不改无关测试</text>
  <text x="535" y="560" class="small">控制改动半径</text>

  <rect x="895" y="240" width="320" height="430" rx="20" class="card"/>
  <text x="935" y="305" class="label">完成定义</text>
  <text x="935" y="360" class="small">输出包含新分类</text>
  <text x="935" y="400" class="small">测试覆盖分类</text>
  <text x="935" y="440" class="small">命令输出可复查</text>
  <text x="935" y="480" class="small">README 同步边界</text>
  <text x="935" y="560" class="small">防止口头完成</text>

  <rect x="1295" y="300" width="210" height="310" rx="20" class="card"/>
  <text x="1330" y="365" class="label">小 diff</text>
  <text x="1330" y="420" class="small">少文件</text>
  <text x="1330" y="460" class="small">有测试</text>
  <text x="1330" y="500" class="small">有证据</text>
</svg>
