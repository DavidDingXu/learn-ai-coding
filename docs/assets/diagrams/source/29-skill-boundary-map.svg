<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 20px "SFMono-Regular", Menlo, Consolas, monospace; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Skill 和其他上下文载体的边界</text>
  <text x="82" y="128" class="subtitle">选错载体会让规则失效、上下文污染，或把一次性要求固化成长期负担。</text>

  <rect x="95" y="230" width="300" height="210" rx="18" class="card" stroke="#93c5fd"/>
  <text x="135" y="285" class="label">Prompt</text>
  <text x="135" y="330" class="small">一次任务约束</text>
  <text x="135" y="365" class="small">临时目标、当前授权</text>
  <text x="135" y="405" class="mono">short-lived</text>

  <rect x="465" y="180" width="300" height="260" rx="18" class="card" stroke="#86efac"/>
  <text x="505" y="235" class="label">AGENTS.md</text>
  <text x="505" y="280" class="small">仓库长期规则</text>
  <text x="505" y="315" class="small">命令、风格、验证要求</text>
  <text x="505" y="355" class="mono">repo-scoped</text>

  <rect x="835" y="145" width="300" height="295" rx="18" class="card" stroke="#c4b5fd"/>
  <text x="875" y="200" class="label">Skill</text>
  <text x="875" y="245" class="small">可复用工作流</text>
  <text x="875" y="280" class="small">指令 + 资料 + 脚本</text>
  <text x="875" y="315" class="small">跨项目复用</text>
  <text x="875" y="355" class="mono">workflow package</text>

  <rect x="1205" y="180" width="300" height="260" rx="18" class="card" stroke="#fbbf24"/>
  <text x="1245" y="235" class="label">Plugin</text>
  <text x="1245" y="280" class="small">可安装 bundle</text>
  <text x="1245" y="315" class="small">skills、MCP、hooks、assets</text>
  <text x="1245" y="355" class="mono">distribution</text>

  <rect x="465" y="550" width="300" height="220" rx="18" class="card" stroke="#fca5a5"/>
  <text x="505" y="605" class="label">MCP</text>
  <text x="505" y="650" class="small">外部资源和工具接入</text>
  <text x="505" y="685" class="small">文档、浏览器、Issue、DB</text>
  <text x="505" y="725" class="mono">live capability</text>

  <rect x="835" y="550" width="300" height="220" rx="18" class="card" stroke="#99f6e4"/>
  <text x="875" y="605" class="label">Subagent</text>
  <text x="875" y="650" class="small">隔离上下文执行子任务</text>
  <text x="875" y="685" class="small">适合并行和专门审查</text>
  <text x="875" y="725" class="mono">execution unit</text>
</svg>
