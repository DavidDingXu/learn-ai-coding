<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f46e5"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .host { fill: #ffffff; stroke: #c7d2fe; stroke-width: 2; filter: url(#shadow); }
      .server { fill: #f8fafc; stroke: #bae6fd; stroke-width: 2; filter: url(#shadow); }
      .risk { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 18px "SFMono-Regular", Menlo, Consolas, monospace; fill: #3730a3; }
      .edge { stroke: #4f46e5; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #f97316; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">MCP 在 AI Coding 里的位置</text>
  <text x="82" y="128" class="subtitle">它不是开发方法论，而是让 Agent 以统一方式访问外部开发资源。</text>

  <rect x="90" y="260" width="320" height="320" rx="22" class="host"/>
  <text x="132" y="325" class="label">AI Coding Host</text>
  <text x="132" y="372" class="small">Codex / Claude Code</text>
  <text x="132" y="410" class="small">Cursor / Copilot</text>
  <text x="132" y="472" class="mono">Agent loop</text>
  <text x="132" y="510" class="mono">rules + skills</text>

  <rect x="545" y="240" width="300" height="145" rx="18" class="server"/>
  <text x="585" y="295" class="label">MCP Server</text>
  <text x="585" y="337" class="small">docs / issues</text>

  <rect x="545" y="455" width="300" height="145" rx="18" class="server"/>
  <text x="585" y="510" class="label">MCP Server</text>
  <text x="585" y="552" class="small">browser / logs</text>

  <rect x="980" y="200" width="245" height="145" rx="18" class="server"/>
  <text x="1015" y="255" class="label">Tools</text>
  <text x="1015" y="297" class="small">执行动作</text>

  <rect x="980" y="385" width="245" height="145" rx="18" class="server"/>
  <text x="1015" y="440" class="label">Resources</text>
  <text x="1015" y="482" class="small">读取资料</text>

  <rect x="980" y="570" width="245" height="145" rx="18" class="server"/>
  <text x="1015" y="625" class="label">Prompts</text>
  <text x="1015" y="667" class="small">预设交互</text>

  <rect x="1325" y="305" width="210" height="275" rx="18" class="risk"/>
  <text x="1360" y="365" class="label">权限边界</text>
  <text x="1360" y="415" class="small">只读优先</text>
  <text x="1360" y="455" class="small">工具白名单</text>
  <text x="1360" y="495" class="small">审批记录</text>
  <text x="1360" y="535" class="small">凭据隔离</text>

  <path d="M410 350 C470 330, 490 315, 545 315" class="edge"/>
  <path d="M410 492 C470 505, 490 528, 545 528" class="edge"/>
  <path d="M845 315 C905 285, 925 272, 980 272" class="edge"/>
  <path d="M845 365 C910 420, 930 455, 980 457" class="edge"/>
  <path d="M845 535 C915 580, 930 640, 980 642" class="edge"/>
  <path d="M1225 272 C1285 300, 1300 350, 1325 390" class="dash"/>
  <path d="M1225 642 C1290 600, 1305 520, 1325 480" class="dash"/>
</svg>
