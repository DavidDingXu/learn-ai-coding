<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #bae6fd; stroke-width: 2; filter: url(#shadow); }
      .head { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 2; }
      .row { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .bad { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
      .good { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">单点验证会留下盲区</text>
  <text x="82" y="128" class="subtitle">截图、接口、数据库、队列各自只能证明一部分事实。</text>

  <rect x="90" y="190" width="1420" height="590" rx="18" class="panel"/>
  <rect x="130" y="240" width="260" height="70" rx="12" class="head"/>
  <rect x="390" y="240" width="500" height="70" rx="12" class="head"/>
  <rect x="890" y="240" width="580" height="70" rx="12" class="head"/>
  <text x="165" y="285" class="label">只做这个</text>
  <text x="430" y="285" class="label">能证明</text>
  <text x="930" y="285" class="label">不能证明</text>

  <rect x="130" y="335" width="260" height="82" class="row"/>
  <rect x="390" y="335" width="500" height="82" class="row"/>
  <rect x="890" y="335" width="580" height="82" class="row"/>
  <text x="165" y="385" class="good">页面截图</text>
  <text x="430" y="385" class="small">用户看到了正确状态</text>
  <text x="930" y="385" class="bad">接口合同、持久化、副作用是否正确</text>

  <rect x="130" y="440" width="260" height="82" class="row"/>
  <rect x="390" y="440" width="500" height="82" class="row"/>
  <rect x="890" y="440" width="580" height="82" class="row"/>
  <text x="165" y="490" class="good">接口测试</text>
  <text x="430" y="490" class="small">HTTP 状态和响应结构</text>
  <text x="930" y="490" class="bad">页面交互、前端状态、真实用户路径</text>

  <rect x="130" y="545" width="260" height="82" class="row"/>
  <rect x="390" y="545" width="500" height="82" class="row"/>
  <rect x="890" y="545" width="580" height="82" class="row"/>
  <text x="165" y="595" class="good">数据库检查</text>
  <text x="430" y="595" class="small">状态是否落地</text>
  <text x="930" y="595" class="bad">响应是否兼容，UI 是否刷新</text>

  <rect x="130" y="650" width="260" height="82" class="row"/>
  <rect x="390" y="650" width="500" height="82" class="row"/>
  <rect x="890" y="650" width="580" height="82" class="row"/>
  <text x="165" y="700" class="good">队列/日志</text>
  <text x="430" y="700" class="small">副作用是否发出</text>
  <text x="930" y="700" class="bad">业务状态是否一致，用户是否可见</text>
</svg>
