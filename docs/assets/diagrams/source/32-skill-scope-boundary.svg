<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .good { stroke: #22c55e; }
      .warn { stroke: #f59e0b; }
      .bad { stroke: #ef4444; }
      .label { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 18px "SFMono-Regular", Menlo, Consolas, monospace; fill: #334155; }
      .pill-good { fill: #dcfce7; }
      .pill-warn { fill: #fef3c7; }
      .pill-bad { fill: #fee2e2; }
      .pill-text { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">哪些经验该写进 Skill</text>
  <text x="82" y="128" class="subtitle">Skill 不是所有规则的仓库。边界越清楚，触发越稳定，维护成本越低。</text>

  <rect x="95" y="245" width="420" height="465" rx="20" class="card good"/>
  <rect x="135" y="285" width="130" height="42" rx="21" class="pill-good"/>
  <text x="160" y="313" class="pill-text">适合</text>
  <text x="135" y="370" class="label">跨项目流程</text>
  <text x="135" y="425" class="small">代码审查顺序</text>
  <text x="135" y="465" class="small">系统化调试步骤</text>
  <text x="135" y="505" class="small">验证记录检查</text>
  <text x="135" y="545" class="small">文章发布前复核</text>
  <text x="135" y="610" class="mono">触发清楚 + 输出可审</text>

  <rect x="590" y="245" width="420" height="465" rx="20" class="card warn"/>
  <rect x="630" y="285" width="130" height="42" rx="21" class="pill-warn"/>
  <text x="655" y="313" class="pill-text">谨慎</text>
  <text x="630" y="370" class="label">项目规则</text>
  <text x="630" y="425" class="small">测试命令</text>
  <text x="630" y="465" class="small">目录约定</text>
  <text x="630" y="505" class="small">业务边界</text>
  <text x="630" y="545" class="small">发布分支策略</text>
  <text x="630" y="610" class="mono">优先放 AGENTS.md / CLAUDE.md</text>

  <rect x="1085" y="245" width="420" height="465" rx="20" class="card bad"/>
  <rect x="1125" y="285" width="130" height="42" rx="21" class="pill-bad"/>
  <text x="1150" y="313" class="pill-text">不要</text>
  <text x="1125" y="370" class="label">临时结论</text>
  <text x="1125" y="425" class="small">某次需求的取舍</text>
  <text x="1125" y="465" class="small">过时工具能力</text>
  <text x="1125" y="505" class="small">聊天里的口头约定</text>
  <text x="1125" y="545" class="small">无法验证的偏好</text>
  <text x="1125" y="610" class="mono">留在任务上下文或删掉</text>
</svg>
