<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .target { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 600 22px "SFMono-Regular", Menlo, Consolas, monospace; fill: #1e293b; }
      .tag { font: 700 23px "SFMono-Regular", Menlo, Consolas, monospace; }
      .arrow { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Delta spec 的合并语义</text>
  <text x="82" y="128" class="subtitle">OpenSpec 不是只保存需求文本，它记录相对当前 spec 的增、改、删。</text>

  <rect x="90" y="210" width="445" height="500" rx="18" class="panel"/>
  <text x="130" y="270" class="label">change 内的 delta</text>
  <rect x="135" y="325" width="350" height="72" rx="12" fill="#ecfdf5" stroke="#86efac"/>
  <text x="165" y="371" class="tag" fill="#15803d">ADDED Requirements</text>
  <text x="150" y="430" class="small">新增一条当前系统没有的行为</text>
  <rect x="135" y="475" width="350" height="72" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="165" y="521" class="tag" fill="#1d4ed8">MODIFIED Requirements</text>
  <text x="150" y="580" class="small">替换一条已有行为的定义</text>
  <rect x="135" y="625" width="350" height="72" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="165" y="671" class="tag" fill="#b91c1c">REMOVED Requirements</text>

  <rect x="610" y="300" width="330" height="320" rx="18" class="target"/>
  <text x="660" y="365" class="label">/opsx:archive</text>
  <text x="660" y="420" class="small">执行合并</text>
  <text x="660" y="465" class="small">移动 change 到 archive</text>
  <text x="660" y="510" class="small">留下可追溯记录</text>

  <rect x="1070" y="210" width="430" height="500" rx="18" class="target"/>
  <text x="1110" y="270" class="label">openspec/specs/</text>
  <text x="1110" y="320" class="small">归档后的系统当前行为</text>
  <rect x="1110" y="375" width="335" height="64" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="1135" y="415" class="mono">新增 requirement 被追加</text>
  <rect x="1110" y="465" width="335" height="64" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="1135" y="505" class="mono">修改 requirement 被替换</text>
  <rect x="1110" y="555" width="335" height="64" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="1135" y="595" class="mono">删除 requirement 被移除</text>

  <path d="M 535 460 C 570 460, 575 460, 610 460" class="arrow"/>
  <path d="M 940 460 C 990 460, 1015 460, 1070 460" class="arrow"/>
  <text x="610" y="760" class="small">关键点：合并的是行为规格，不是把 change 文件夹复制到主规格里。</text>
</svg>
