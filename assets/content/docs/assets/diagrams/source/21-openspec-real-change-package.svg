  <path d="M500 450 L590 450" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1010 450 L1100 450" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1310 730 C1310 820 290 820 290 730" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="620" y="812" font-family="Arial, sans-serif" font-size="18" fill="#475569">archive / sync 后，完成行为进入当前规格</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
