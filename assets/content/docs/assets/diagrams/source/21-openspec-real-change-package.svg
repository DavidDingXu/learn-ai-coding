  <text x="650" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">design.md</text>
  <rect x="626" y="536" width="330" height="58" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="650" y="572" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">tasks.md</text>
