  <text x="116" y="260" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">personal-productivity-app</text>
  <rect x="116" y="302" width="330" height="62" rx="12" fill="#ecfdf5" stroke="#86efac"/>
  <text x="140" y="340" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">overdue tasks</text>
  <rect x="116" y="390" width="330" height="62" rx="12" fill="#ecfdf5" stroke="#86efac"/>
  <text x="140" y="428" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">daily capacity</text>
  <rect x="116" y="478" width="330" height="62" rx="12" fill="#ecfdf5" stroke="#86efac"/>
  <text x="140" y="516" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">items / deferred</text>
  <text x="116" y="610" font-family="Arial, sans-serif" font-size="17" fill="#4b5563">先写用户可见行为和非目标</text>
