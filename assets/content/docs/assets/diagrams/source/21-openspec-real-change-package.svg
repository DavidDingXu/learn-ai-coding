  <text x="1160" y="416" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">test/today-plan.test.js</text>
  <rect x="1136" y="458" width="330" height="58" rx="12" fill="#fff7ed" stroke="#fdba74"/>
