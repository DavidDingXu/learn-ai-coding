<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0891b2"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #a5f3fc; stroke-width: 2; filter: url(#shadow); }
      .gate { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 17px "SFMono-Regular", Menlo, Consolas, monospace; fill: #0e7490; }
      .edge { stroke: #0891b2; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">陌生模块接手不是先改代码</text>
  <text x="82" y="128" class="subtitle">先建立代码地图和任务上下文，再授权 AI 做一个可验证的小改动。</text>

  <rect x="80" y="295" width="230" height="160" rx="18" class="node"/>
  <text x="112" y="350" class="label">扫仓库</text>
  <text x="112" y="390" class="small">入口、测试、配置</text>
  <text x="112" y="425" class="mono">codemap</text>

  <rect x="390" y="235" width="250" height="280" rx="18" class="node"/>
  <text x="422" y="290" class="label">读关键文件</text>
  <text x="422" y="330" class="small">README</text>
  <text x="422" y="365" class="small">cli.js</text>
  <text x="422" y="400" class="small">lib/*.js</text>
  <text x="422" y="435" class="small">test/*.test.js</text>

  <rect x="720" y="270" width="250" height="210" rx="18" class="gate"/>
  <text x="752" y="325" class="label">任务上下文包</text>
  <text x="752" y="365" class="small">目标、约束</text>
  <text x="752" y="400" class="small">优先读文件</text>
  <text x="752" y="435" class="mono">task-context</text>

  <rect x="1050" y="235" width="250" height="280" rx="18" class="node"/>
  <text x="1082" y="290" class="label">小步改动</text>
  <text x="1082" y="330" class="small">先测现状</text>
  <text x="1082" y="365" class="small">只改当前模块</text>
  <text x="1082" y="400" class="small">保留验证证据</text>

  <rect x="1380" y="295" width="150" height="160" rx="18" class="node"/>
  <text x="1410" y="350" class="label">验证</text>
  <text x="1410" y="390" class="small">测试</text>
  <text x="1410" y="425" class="small">ledger</text>

  <path d="M310 375 C345 375, 355 375, 390 375" class="edge"/>
  <path d="M640 375 C675 375, 685 375, 720 375" class="edge"/>
  <path d="M970 375 C1005 375, 1015 375, 1050 375" class="edge"/>
  <path d="M1300 375 C1330 375, 1345 375, 1380 375" class="edge"/>
</svg>
