<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .stage { filter: url(#shadow); }
      .side { fill: #ffffff; stroke: #dcfce7; stroke-width: 2; filter: url(#shadow); }
      .reject { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .rejectText { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #7c2d12; }
      .rejectTitle { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9a3412; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">上下文选择漏斗</text>
  <text x="82" y="128" class="subtitle">不要把整个项目塞给 Agent，要把任务需要的证据按优先级筛出来。</text>

  <path d="M 330 200 L 1270 200 L 1160 310 L 440 310 Z" fill="#dcfce7" class="stage"/>
  <text x="620" y="266" class="label">任务目标 + 硬约束</text>

  <path d="M 440 340 L 1160 340 L 1050 450 L 550 450 Z" fill="#bbf7d0" class="stage"/>
  <text x="668" y="406" class="label">入口文件 + 关键实现</text>

  <path d="M 550 480 L 1050 480 L 960 590 L 640 590 Z" fill="#86efac" class="stage"/>
  <text x="686" y="546" class="label">测试 + 日志 + 命令</text>

  <path d="M 640 620 L 960 620 L 885 730 L 715 730 Z" fill="#22c55e" class="stage"/>
  <text x="724" y="686" class="label" fill="#ffffff">最小可行动上下文</text>

  <rect x="90" y="250" width="260" height="150" rx="18" class="reject"/>
  <text x="130" y="304" class="rejectTitle">过滤掉</text>
  <text x="130" y="344" class="rejectText">过期文档</text>
  <text x="130" y="376" class="rejectText">相似但无关文件</text>

  <rect x="1250" y="480" width="260" height="150" rx="18" class="reject"/>
  <text x="1290" y="534" class="rejectTitle">降级为假设</text>
  <text x="1290" y="574" class="rejectText">个人猜测</text>
  <text x="1290" y="606" class="rejectText">未验证结论</text>

  <rect x="330" y="780" width="940" height="70" rx="18" class="side"/>
  <text x="376" y="824" class="text">原则：先给任务必须材料，缺什么再补什么；发现冲突先停，不让 Agent 自行选择。</text>
</svg>
