<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .raw { fill: #fee2e2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .req { fill: #dbeafe; stroke: #93c5fd; stroke-width: 2; filter: url(#shadow); }
      .done { fill: #dcfce7; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .head { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">从一句需求到 requirements</text>
  <text x="82" y="128" class="subtitle">把模糊需求拆成行为、验收、异常、非目标和开放问题。</text>

  <rect x="105" y="300" width="300" height="150" rx="20" class="raw"/>
  <text x="155" y="356" class="head">一句话需求</text>
  <text x="155" y="398" class="text">已支付订单不能直接取消</text>

  <rect x="510" y="205" width="300" height="130" rx="20" class="req"/>
  <text x="560" y="256" class="head">Goal</text>
  <text x="560" y="294" class="text">用户可见行为</text>

  <rect x="510" y="385" width="300" height="130" rx="20" class="req"/>
  <text x="560" y="436" class="head">Acceptance</text>
  <text x="560" y="474" class="text">Given / When / Then</text>

  <rect x="510" y="565" width="300" height="130" rx="20" class="req"/>
  <text x="560" y="616" class="head">Out Of Scope</text>
  <text x="560" y="654" class="text">本次不改什么</text>

  <rect x="910" y="205" width="300" height="130" rx="20" class="req"/>
  <text x="960" y="256" class="head">Error Cases</text>
  <text x="960" y="294" class="text">失败、重复、并发</text>

  <rect x="910" y="385" width="300" height="130" rx="20" class="req"/>
  <text x="960" y="436" class="head">Open Questions</text>
  <text x="960" y="474" class="text">需要人确认</text>

  <rect x="910" y="565" width="300" height="130" rx="20" class="done"/>
  <text x="960" y="616" class="head">可测试合同</text>
  <text x="960" y="654" class="text">能推导测试和验证</text>

  <path d="M 405 375 C 465 340, 480 285, 510 270" class="line"/>
  <path d="M 405 375 L 510 450" class="line"/>
  <path d="M 405 390 C 470 480, 480 590, 510 630" class="line"/>
  <path d="M 810 270 L 910 270" class="line"/>
  <path d="M 810 450 L 910 450" class="line"/>
  <path d="M 810 630 L 910 630" class="line"/>
</svg>
