<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 20px "SFMono-Regular", Menlo, Consolas, monospace; fill: #1e293b; }
      .level { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">改动半径越大，验证半径也要扩大</text>
  <text x="82" y="128" class="subtitle">小 diff 不是按行数判断，而是按行为、模块、接口和回滚边界判断。</text>

  <rect x="90" y="220" width="330" height="430" rx="18" class="card" stroke="#93c5fd"/>
  <text x="130" y="275" class="level" fill="#1d4ed8">Level 1</text>
  <text x="130" y="318" class="label">单文件行为</text>
  <text x="130" y="370" class="small">一个规则、一个函数、一个测试点</text>
  <text x="130" y="430" class="mono">git diff -- file</text>
  <text x="130" y="470" class="small">验证：focused test</text>
  <text x="130" y="510" class="small">适合：首选执行粒度</text>

  <rect x="465" y="180" width="330" height="510" rx="18" class="card" stroke="#86efac"/>
  <text x="505" y="235" class="level" fill="#15803d">Level 2</text>
  <text x="505" y="278" class="label">同模块联动</text>
  <text x="505" y="330" class="small">service、状态机、测试一起变</text>
  <text x="505" y="390" class="mono">git diff --stat</text>
  <text x="505" y="430" class="small">验证：module test</text>
  <text x="505" y="470" class="small">要求：任务边界清楚</text>
  <text x="505" y="510" class="small">风险：容易夹带重构</text>

  <rect x="840" y="140" width="330" height="590" rx="18" class="card" stroke="#fbbf24"/>
  <text x="880" y="195" class="level" fill="#a16207">Level 3</text>
  <text x="880" y="238" class="label">跨模块行为</text>
  <text x="880" y="290" class="small">接口、持久化、异步任务联动</text>
  <text x="880" y="350" class="mono">git diff --name-only</text>
  <text x="880" y="390" class="small">验证：module + integration</text>
  <text x="880" y="430" class="small">要求：设计和回滚边界</text>
  <text x="880" y="470" class="small">建议：拆成多个 diff</text>

  <rect x="1215" y="100" width="300" height="670" rx="18" class="card" stroke="#fca5a5"/>
  <text x="1255" y="155" class="level" fill="#b91c1c">Level 4</text>
  <text x="1255" y="198" class="label">系统级变更</text>
  <text x="1255" y="250" class="small">协议、schema、公共 API</text>
  <text x="1255" y="310" class="mono">git diff --stat</text>
  <text x="1255" y="350" class="small">验证：完整回归 + 人审</text>
  <text x="1255" y="390" class="small">要求：明确迁移和兼容</text>
  <text x="1255" y="430" class="small">AI 不应一次完成</text>

  <rect x="210" y="740" width="1180" height="76" rx="16" fill="#ffffff" stroke="#ddd6fe" filter="url(#shadow)"/>
  <text x="260" y="788" class="small">判断标准：一个 diff 能否一句话解释、能否单独验证、能否单独回滚。</text>
</svg>
