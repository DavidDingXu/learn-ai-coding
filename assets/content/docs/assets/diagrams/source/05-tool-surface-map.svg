<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .surface { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .center { fill: #1e293b; filter: url(#shadow); }
      .nodeTitle { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .centerTitle { font: 700 31px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .centerText { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e2e8f0; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1d4ed8; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; stroke-linecap: round; }
      .app { fill: #eff6ff; stroke: #93c5fd; }
      .cli { fill: #ecfdf5; stroke: #86efac; }
      .ide { fill: #fef3c7; stroke: #fcd34d; }
      .comp { fill: #f5f3ff; stroke: #c4b5fd; }
      .bgagent { fill: #fee2e2; stroke: #fca5a5; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">AI Coding 工具工作面分工</text>
  <text x="82" y="128" class="subtitle">不要比较“谁最强”，先判断当前动作应该发生在哪个工作面。</text>

  <circle cx="800" cy="460" r="145" class="center"/>
  <text x="706" y="438" class="centerTitle">真实开发任务</text>
  <text x="686" y="482" class="centerText">规划、编辑、验证、审查</text>

  <rect x="130" y="190" width="350" height="168" rx="22" class="surface app"/>
  <text x="178" y="244" class="nodeTitle">App</text>
  <text x="178" y="288" class="text">需求澄清 / 风险分析</text>
  <text x="178" y="324" class="small">方案审查、复盘、资料整理</text>

  <rect x="625" y="120" width="350" height="168" rx="22" class="surface cli"/>
  <text x="673" y="174" class="nodeTitle">CLI Agent</text>
  <text x="673" y="218" class="text">读仓库 / 改文件 / 跑命令</text>
  <text x="673" y="254" class="small">小 diff、测试、调试、验证记录</text>

  <rect x="1120" y="190" width="350" height="168" rx="22" class="surface ide"/>
  <text x="1168" y="244" class="nodeTitle">IDE Agent</text>
  <text x="1168" y="288" class="text">局部编辑 / 跳转 / 类型修复</text>
  <text x="1168" y="324" class="small">选区修改、UI 细节、相邻测试</text>

  <rect x="270" y="650" width="350" height="168" rx="22" class="surface comp"/>
  <text x="318" y="704" class="nodeTitle">Completion</text>
  <text x="318" y="748" class="text">当前文件内加速输入</text>
  <text x="318" y="784" class="small">人先确定逻辑，AI 补机械代码</text>

  <rect x="980" y="650" width="350" height="168" rx="22" class="surface bgagent"/>
  <text x="1028" y="704" class="nodeTitle">后台 Agent</text>
  <text x="1028" y="748" class="text">清晰异步任务</text>
  <text x="1028" y="784" class="small">issue 明确、范围小、可验证</text>

  <path d="M 480 300 C 575 340, 620 386, 660 420" class="line"/>
  <path d="M 800 288 C 800 330, 800 352, 800 315" class="line"/>
  <path d="M 1120 300 C 1020 340, 980 386, 940 420" class="line"/>
  <path d="M 620 700 C 680 620, 700 585, 710 560" class="line"/>
  <path d="M 980 700 C 920 620, 900 585, 890 560" class="line"/>

  <text x="520" y="352" class="label">澄清后带回仓库</text>
  <text x="822" y="335" class="label">仓库级执行</text>
  <text x="982" y="352" class="label">局部代码面</text>
  <text x="642" y="646" class="label">低风险连续编码</text>
  <text x="918" y="646" class="label">异步交付</text>
</svg>
