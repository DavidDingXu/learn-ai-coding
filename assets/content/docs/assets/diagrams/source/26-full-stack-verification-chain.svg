<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 18px "SFMono-Regular", Menlo, Consolas, monospace; fill: #065f46; }
      .edge { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">前后端验证闭环</text>
  <text x="82" y="128" class="subtitle">页面可见、接口正确、状态落地、副作用发生，四类证据要能互相对上。</text>

  <rect x="90" y="290" width="245" height="170" rx="18" class="node"/>
  <text x="130" y="350" class="label">UI 行为</text>
  <text x="130" y="392" class="small">按钮、提示、状态刷新</text>
  <text x="130" y="428" class="mono">Playwright / screenshot</text>

  <rect x="435" y="250" width="255" height="250" rx="18" class="node"/>
  <text x="475" y="310" class="label">HTTP 合同</text>
  <text x="475" y="352" class="small">status code</text>
  <text x="475" y="386" class="small">request / response shape</text>
  <text x="475" y="420" class="small">错误 envelope</text>
  <text x="475" y="456" class="mono">api test / curl</text>

  <rect x="790" y="250" width="255" height="250" rx="18" class="node"/>
  <text x="830" y="310" class="label">业务状态</text>
  <text x="830" y="352" class="small">订单状态</text>
  <text x="830" y="386" class="small">数据库记录</text>
  <text x="830" y="420" class="small">幂等结果</text>
  <text x="830" y="456" class="mono">service / db check</text>

  <rect x="1145" y="250" width="275" height="250" rx="18" class="node"/>
  <text x="1185" y="310" class="label">副作用</text>
  <text x="1185" y="352" class="small">退款请求</text>
  <text x="1185" y="386" class="small">消息、任务、日志</text>
  <text x="1185" y="420" class="small">外部回调边界</text>
  <text x="1185" y="456" class="mono">mock / queue / ledger</text>

  <rect x="455" y="630" width="700" height="100" rx="18" class="node"/>
  <text x="510" y="690" class="label">验证记录：命令、结果、截图、残余风险</text>

  <path d="M335 375 C375 375, 395 375, 435 375" class="edge"/>
  <path d="M690 375 C730 375, 750 375, 790 375" class="edge"/>
  <path d="M1045 375 C1085 375, 1105 375, 1145 375" class="edge"/>
  <path d="M1282 500 C1180 610, 1010 650, 955 630" class="edge"/>
  <path d="M560 500 C590 555, 650 610, 720 630" class="edge"/>
</svg>
