<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .center { fill: #14532d; filter: url(#shadow); }
      .item { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; filter: url(#shadow); }
      .centerTitle { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .centerText { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dcfce7; }
      .itemTitle { font: 700 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">任务上下文包的组成</text>
  <text x="82" y="128" class="subtitle">一次需求开始前，先把目标、边界、证据和验证写清楚。</text>

  <circle cx="800" cy="455" r="135" class="center"/>
  <text x="690" y="438" class="centerTitle">Task Context</text>
  <text x="660" y="482" class="centerText">本次任务的工程合同</text>

  <rect x="155" y="190" width="285" height="120" rx="18" class="item"/>
  <text x="198" y="238" class="itemTitle">Objective</text>
  <text x="198" y="276" class="text">完成后的行为</text>

  <rect x="520" y="160" width="285" height="120" rx="18" class="item"/>
  <text x="563" y="208" class="itemTitle">Files</text>
  <text x="563" y="246" class="text">先读哪些文件</text>

  <rect x="895" y="160" width="285" height="120" rx="18" class="item"/>
  <text x="938" y="208" class="itemTitle">Constraints</text>
  <text x="938" y="246" class="text">不能改什么</text>

  <rect x="1230" y="335" width="285" height="120" rx="18" class="item"/>
  <text x="1273" y="383" class="itemTitle">Evidence</text>
  <text x="1273" y="421" class="text">事实和假设分开</text>

  <rect x="1120" y="605" width="285" height="120" rx="18" class="item"/>
  <text x="1163" y="653" class="itemTitle">Done When</text>
  <text x="1163" y="691" class="text">测试和验证路径</text>

  <rect x="695" y="690" width="285" height="120" rx="18" class="item"/>
  <text x="738" y="738" class="itemTitle">Agent Mode</text>
  <text x="738" y="776" class="text">能否编辑、改几步</text>

  <rect x="300" y="605" width="285" height="120" rx="18" class="item"/>
  <text x="343" y="653" class="itemTitle">Open Questions</text>
  <text x="343" y="691" class="text">需要人确认的点</text>

  <rect x="85" y="365" width="285" height="120" rx="18" class="item"/>
  <text x="128" y="413" class="itemTitle">Context Sources</text>
  <text x="128" y="451" class="text">规则文件和代码地图</text>
</svg>
