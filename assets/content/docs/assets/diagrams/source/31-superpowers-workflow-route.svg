<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; filter: url(#shadow); }
      .gate { fill: #fefce8; stroke: #fde68a; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 17px "SFMono-Regular", Menlo, Consolas, monospace; fill: #166534; }
      .edge { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Superpowers 把多个 Skill 串成开发路线</text>
  <text x="82" y="128" class="subtitle">价值不在某一个 Skill，而在任务从想法到验证的阶段门禁。</text>

  <rect x="75" y="280" width="210" height="140" rx="18" class="node"/>
  <text x="105" y="333" class="label">brainstorming</text>
  <text x="105" y="372" class="small">澄清目标和设计</text>

  <rect x="360" y="230" width="210" height="240" rx="18" class="node"/>
  <text x="390" y="283" class="label">writing-plans</text>
  <text x="390" y="322" class="small">拆小任务</text>
  <text x="390" y="357" class="small">文件、命令、步骤</text>
  <text x="390" y="395" class="mono">docs/superpowers/plans</text>

  <rect x="645" y="250" width="230" height="200" rx="18" class="gate"/>
  <text x="675" y="303" class="label">execution</text>
  <text x="675" y="342" class="small">subagent 或 inline</text>
  <text x="675" y="377" class="small">逐任务执行</text>

  <rect x="950" y="210" width="230" height="160" rx="18" class="node"/>
  <text x="980" y="263" class="label">TDD / debug</text>
  <text x="980" y="302" class="small">红灯、绿灯</text>
  <text x="980" y="337" class="small">证据排障</text>

  <rect x="950" y="460" width="230" height="150" rx="18" class="node"/>
  <text x="980" y="513" class="label">code review</text>
  <text x="980" y="552" class="small">每个任务后审查</text>

  <rect x="1260" y="305" width="250" height="180" rx="18" class="node"/>
  <text x="1290" y="358" class="label">verification</text>
  <text x="1290" y="397" class="small">运行命令</text>
  <text x="1290" y="432" class="small">报告证据和风险</text>

  <path d="M285 350 C320 350, 330 350, 360 350" class="edge"/>
  <path d="M570 350 C600 350, 615 350, 645 350" class="edge"/>
  <path d="M875 335 C910 300, 925 290, 950 290" class="edge"/>
  <path d="M875 365 C920 455, 925 520, 950 535" class="edge"/>
  <path d="M1180 290 C1220 330, 1235 355, 1260 385" class="edge"/>
  <path d="M1180 535 C1235 500, 1240 470, 1260 430" class="edge"/>
</svg>
