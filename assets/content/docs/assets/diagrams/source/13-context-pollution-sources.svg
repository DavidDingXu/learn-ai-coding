<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .center { fill: #7f1d1d; filter: url(#shadow); }
      .source { fill: #ffffff; stroke: #fecaca; stroke-width: 2; filter: url(#shadow); }
      .centerTitle { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .centerText { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fee2e2; }
      .sourceTitle { font: 700 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">上下文污染来源</text>
  <text x="82" y="128" class="subtitle">长任务里，旧假设、无关文件和混杂输出会持续影响 Agent 的下一步判断。</text>

  <circle cx="800" cy="455" r="132" class="center"/>
  <text x="690" y="438" class="centerTitle">Context Pollution</text>
  <text x="666" y="482" class="centerText">事实、猜测和旧结论混在一起</text>

  <rect x="130" y="210" width="300" height="116" rx="18" class="source"/>
  <text x="178" y="258" class="sourceTitle">未验证假设</text>
  <text x="178" y="296" class="text">“可能是缓存”</text>

  <rect x="500" y="165" width="300" height="116" rx="18" class="source"/>
  <text x="548" y="213" class="sourceTitle">被否定结论</text>
  <text x="548" y="251" class="text">已经排除但仍在对话里</text>

  <rect x="870" y="165" width="300" height="116" rx="18" class="source"/>
  <text x="918" y="213" class="sourceTitle">过期计划</text>
  <text x="918" y="251" class="text">旧文件和旧方案</text>

  <rect x="1170" y="360" width="300" height="116" rx="18" class="source"/>
  <text x="1218" y="408" class="sourceTitle">无关文件</text>
  <text x="1218" y="446" class="text">demo / legacy / generated</text>

  <rect x="875" y="640" width="300" height="116" rx="18" class="source"/>
  <text x="923" y="688" class="sourceTitle">混杂输出</text>
  <text x="923" y="726" class="text">旧失败和新失败混在一起</text>

  <rect x="430" y="640" width="300" height="116" rx="18" class="source"/>
  <text x="478" y="688" class="sourceTitle">随口目标</text>
  <text x="478" y="726" class="text">“顺便重构一下”</text>

  <rect x="130" y="455" width="300" height="116" rx="18" class="source"/>
  <text x="178" y="503" class="sourceTitle">过期文档</text>
  <text x="178" y="541" class="text">旧接口和旧命令</text>
</svg>
