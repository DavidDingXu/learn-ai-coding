<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#fbfbf8"/>
  <text x="80" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">MCP 接入阶梯：不是所有脚本都需要协议化</text>
  <text x="80" y="124" font-family="Arial, sans-serif" font-size="18" fill="#64748b">先证明工具边界，再决定是否暴露为 tools、resources 或 prompts</text>
  <g font-family="Arial, sans-serif">
    <rect x="170" y="610" width="280" height="115" rx="16" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="205" y="658" font-size="23" font-weight="700" fill="#991b1b">手写上下文</text>
    <text x="205" y="694" font-size="17" fill="#7f1d1d">小任务，人工选择文件</text>

    <rect x="385" y="475" width="310" height="115" rx="16" fill="#ffedd5" stroke="#fdba74"/>
    <text x="420" y="523" font-size="23" font-weight="700" fill="#9a3412">本地只读 CLI</text>
    <text x="420" y="559" font-size="17" fill="#9a3412">context-pack 输出 Markdown</text>

    <rect x="635" y="340" width="330" height="115" rx="16" fill="#fef9c3" stroke="#fde047"/>
    <text x="670" y="388" font-size="23" font-weight="700" fill="#854d0e">项目脚本库</text>
    <text x="670" y="424" font-size="17" fill="#854d0e">统一命令、测试、文档</text>

    <rect x="895" y="205" width="345" height="115" rx="16" fill="#dcfce7" stroke="#86efac"/>
    <text x="930" y="253" font-size="23" font-weight="700" fill="#166534">MCP server</text>
    <text x="930" y="289" font-size="17" fill="#166534">跨客户端发现和授权</text>

    <rect x="1165" y="70" width="350" height="115" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="1200" y="118" font-size="23" font-weight="700" fill="#1d4ed8">外部系统接入</text>
    <text x="1200" y="154" font-size="17" fill="#1d4ed8">Docs / Issue / Browser / Logs</text>

    <path d="M450 610 L520 590" stroke="#64748b" stroke-width="4" marker-end="url(#a36b)"/>
    <path d="M695 475 L770 455" stroke="#64748b" stroke-width="4" marker-end="url(#a36b)"/>
    <path d="M965 340 L1030 320" stroke="#64748b" stroke-width="4" marker-end="url(#a36b)"/>
    <path d="M1240 205 L1300 185" stroke="#64748b" stroke-width="4" marker-end="url(#a36b)"/>
  </g>
  <rect x="170" y="780" width="1180" height="58" rx="14" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="205" y="817" font-family="Arial, sans-serif" font-size="19" fill="#44403c">升级条件：多客户端复用、权限需要显式治理、外部资源实时变化、工具需要被 Agent 自动发现。</text>
  <defs>
    <marker id="a36b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
