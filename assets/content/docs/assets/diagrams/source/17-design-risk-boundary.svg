<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .risk { fill: #fee2e2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .verify { fill: #dcfce7; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .mid { fill: #ffffff; stroke: #fde68a; stroke-width: 2; filter: url(#shadow); }
      .headRisk { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #991b1b; }
      .headVerify { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #166534; }
      .head { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">design 风险和验证边界</text>
  <text x="82" y="128" class="subtitle">design 里的每个风险，都应该能落到测试、命令、接口或人工检查。</text>

  <rect x="120" y="220" width="380" height="150" rx="22" class="risk"/>
  <text x="170" y="278" class="headRisk">风险</text>
  <text x="170" y="320" class="text">重复取消创建重复退款请求</text>

  <rect x="610" y="220" width="380" height="150" rx="22" class="mid"/>
  <text x="660" y="278" class="head">设计约束</text>
  <text x="660" y="320" class="text">退款请求必须幂等</text>

  <rect x="1100" y="220" width="380" height="150" rx="22" class="verify"/>
  <text x="1150" y="278" class="headVerify">验证</text>
  <text x="1150" y="320" class="text">duplicate paid cancel test</text>

  <rect x="120" y="500" width="380" height="150" rx="22" class="risk"/>
  <text x="170" y="558" class="headRisk">风险</text>
  <text x="170" y="600" class="text">旧客户端不识别新状态</text>

  <rect x="610" y="500" width="380" height="150" rx="22" class="mid"/>
  <text x="660" y="558" class="head">兼容边界</text>
  <text x="660" y="600" class="text">response shape 不变</text>

  <rect x="1100" y="500" width="380" height="150" rx="22" class="verify"/>
  <text x="1150" y="558" class="headVerify">验证</text>
  <text x="1150" y="600" class="text">API compatibility test</text>
</svg>
