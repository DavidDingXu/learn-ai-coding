<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #bbf7d0; stroke-width: 2; filter: url(#shadow); }
      .gate { fill: #fef3c7; stroke: #fbbf24; stroke-width: 2; filter: url(#shadow); }
      .done { fill: #166534; filter: url(#shadow); }
      .nodeTitle { font: 700 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .doneTitle { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .doneText { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dcfce7; }
      .line { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">从规格到代码的工作流</text>
  <text x="82" y="128" class="subtitle">先把需求、设计和任务写成合同，再让 Agent 小步实现。</text>

  <rect x="110" y="300" width="230" height="130" rx="18" class="node"/>
  <text x="150" y="352" class="nodeTitle">原始需求</text>
  <text x="150" y="390" class="text">一句话、issue、用户反馈</text>

  <rect x="410" y="300" width="230" height="130" rx="18" class="node"/>
  <text x="450" y="352" class="nodeTitle">requirements.md</text>
  <text x="450" y="390" class="text">行为和验收条件</text>

  <rect x="710" y="300" width="230" height="130" rx="18" class="node"/>
  <text x="750" y="352" class="nodeTitle">design.md</text>
  <text x="750" y="390" class="text">方案、边界、风险</text>

  <rect x="1010" y="300" width="230" height="130" rx="18" class="node"/>
  <text x="1050" y="352" class="nodeTitle">tasks.md</text>
  <text x="1050" y="390" class="text">小 diff 和验证</text>

  <rect x="1310" y="300" width="230" height="130" rx="18" class="done"/>
  <text x="1350" y="352" class="doneTitle">实现和验证</text>
  <text x="1350" y="390" class="doneText">代码、测试、报告</text>

  <path d="M 340 365 L 410 365" class="line"/>
  <path d="M 640 365 L 710 365" class="line"/>
  <path d="M 940 365 L 1010 365" class="line"/>
  <path d="M 1240 365 L 1310 365" class="line"/>

  <rect x="380" y="590" width="840" height="120" rx="22" class="gate"/>
  <text x="430" y="642" class="nodeTitle">控制点前移</text>
  <text x="430" y="680" class="text">需求、边界、非目标和验证方式，在写代码前被审查，而不是在大 diff 之后补救。</text>
</svg>
