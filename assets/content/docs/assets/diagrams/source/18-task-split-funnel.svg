<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .stage { filter: url(#shadow); }
      .label { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .side { fill: #ffffff; stroke: #99f6e4; stroke-width: 2; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">从 design 到小 diff tasks</text>
  <text x="82" y="128" class="subtitle">把设计拆成一串能审、能测、能停的小步骤。</text>

  <path d="M 280 190 L 1320 190 L 1180 330 L 420 330 Z" fill="#ccfbf1" class="stage"/>
  <text x="660" y="270" class="label">design.md：方案和风险</text>

  <path d="M 420 370 L 1180 370 L 1060 500 L 540 500 Z" fill="#99f6e4" class="stage"/>
  <text x="650" y="448" class="label">task candidates：测试、规则、编排、异常</text>

  <path d="M 540 540 L 1060 540 L 955 670 L 645 670 Z" fill="#5eead4" class="stage"/>
  <text x="705" y="618" class="label">可验证小 diff</text>

  <rect x="260" y="735" width="1080" height="80" rx="18" class="side"/>
  <text x="312" y="785" class="text">每个 task 必须有 Goal / Files / Verify / Stop if，不能只写一个大标题。</text>
</svg>
