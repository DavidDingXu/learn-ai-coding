<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fefce8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ca8a04"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #fde68a; stroke-width: 2; filter: url(#shadow); }
      .bad { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .ok { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .edge { stroke: #ca8a04; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">测试失败不能靠一句“无关”带过</text>
  <text x="82" y="128" class="subtitle">先用 baseline 和 diff 证据分类，再决定修、停、还是记录风险。</text>

  <rect x="110" y="250" width="265" height="145" rx="18" class="node"/>
  <text x="150" y="305" class="label">测试失败</text>
  <text x="150" y="345" class="small">保留命令和输出</text>

  <rect x="485" y="220" width="285" height="205" rx="18" class="node"/>
  <text x="525" y="280" class="label">先看 baseline</text>
  <text x="525" y="322" class="small">改前是否已失败</text>
  <text x="525" y="356" class="small">同命令是否可复现</text>

  <rect x="880" y="175" width="280" height="150" rx="18" class="bad"/>
  <text x="920" y="230" class="label">当前 diff 引入</text>
  <text x="920" y="270" class="small">回到本次改动修</text>

  <rect x="880" y="370" width="280" height="150" rx="18" class="node"/>
  <text x="920" y="425" class="label">baseline 旧失败</text>
  <text x="920" y="465" class="small">停止或单独记录</text>

  <rect x="1245" y="175" width="280" height="150" rx="18" class="ok"/>
  <text x="1285" y="230" class="label">预期红灯</text>
  <text x="1285" y="270" class="small">TDD 阶段可接受</text>

  <rect x="1245" y="370" width="280" height="150" rx="18" class="node"/>
  <text x="1285" y="425" class="label">环境或外部依赖</text>
  <text x="1285" y="465" class="small">记录证据和后续验证</text>

  <rect x="600" y="640" width="430" height="105" rx="18" class="node"/>
  <text x="650" y="704" class="label">写入 verification ledger</text>

  <path d="M375 322 C420 322, 440 322, 485 322" class="edge"/>
  <path d="M770 305 C820 260, 840 245, 880 245" class="edge"/>
  <path d="M770 355 C820 405, 840 445, 880 445" class="edge"/>
  <path d="M1160 250 C1195 250, 1210 250, 1245 250" class="edge"/>
  <path d="M1160 445 C1195 445, 1210 445, 1245 445" class="edge"/>
  <path d="M1018 520 C960 600, 900 635, 815 640" class="edge"/>
  <path d="M1385 520 C1230 630, 1080 675, 1030 692" class="edge"/>
</svg>
