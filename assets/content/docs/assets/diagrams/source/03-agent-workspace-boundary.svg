<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .boxTitle { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1d4ed8; }
      .card { fill: #ffffff; stroke: #dbeafe; stroke-width: 2; filter: url(#shadow); }
      .tool { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .risk { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; }
      .agent { fill: #eff6ff; stroke: #60a5fa; stroke-width: 3; filter: url(#shadow); }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Agent 工作边界：它只基于可见证据行动</text>
  <text x="82" y="128" class="subtitle">稳定的 AI Coding，要把任务、上下文、工具和验证输出放到同一个可观察循环里。</text>

  <rect x="80" y="190" width="300" height="170" rx="18" class="card"/>
  <text x="118" y="244" class="boxTitle">程序员</text>
  <text x="118" y="292" class="text">任务目标</text>
  <text x="118" y="326" class="text">硬约束</text>

  <rect x="80" y="430" width="300" height="180" rx="18" class="card"/>
  <text x="118" y="484" class="boxTitle">规则层</text>
  <text x="118" y="532" class="text">AGENTS.md</text>
  <text x="118" y="566" class="text">项目命令</text>

  <rect x="590" y="260" width="420" height="250" rx="26" class="agent"/>
  <text x="710" y="336" class="boxTitle">Coding Agent</text>
  <text x="658" y="386" class="text">根据上下文生成下一步动作</text>
  <text x="658" y="424" class="text">通过工具观察真实结果</text>
  <text x="658" y="462" class="text">根据输出继续调整</text>

  <rect x="1190" y="168" width="300" height="146" rx="18" class="tool"/>
  <text x="1230" y="222" class="boxTitle">文件系统</text>
  <text x="1230" y="268" class="text">读文件 / 写 diff</text>

  <rect x="1190" y="360" width="300" height="146" rx="18" class="tool"/>
  <text x="1230" y="414" class="boxTitle">Shell</text>
  <text x="1230" y="460" class="text">测试 / 构建 / lint</text>

  <rect x="1190" y="552" width="300" height="146" rx="18" class="tool"/>
  <text x="1230" y="606" class="boxTitle">外部工具</text>
  <text x="1230" y="652" class="text">浏览器 / MCP / IDE</text>

  <path class="line" d="M 380 275 C 465 275, 500 310, 590 340"/>
  <text x="418" y="256" class="label">任务输入</text>
  <path class="line" d="M 380 520 C 470 500, 505 448, 590 420"/>
  <text x="418" y="500" class="label">规则输入</text>

  <path class="line" d="M 1010 342 C 1080 292, 1115 244, 1190 236"/>
  <path class="line" d="M 1010 395 C 1080 405, 1115 426, 1190 430"/>
  <path class="line" d="M 1010 452 C 1082 510, 1112 590, 1190 622"/>

  <path class="dash" d="M 1190 295 C 1110 325, 1080 340, 1010 360"/>
  <path class="dash" d="M 1190 486 C 1112 470, 1075 450, 1010 428"/>
  <path class="dash" d="M 1190 675 C 1115 620, 1080 545, 1010 470"/>
  <text x="1042" y="250" class="label">动作</text>
  <text x="1042" y="530" class="label">观察结果</text>

  <rect x="80" y="720" width="1410" height="104" rx="20" class="risk"/>
  <text x="118" y="766" class="boxTitle">不可见区域</text>
  <text x="314" y="766" class="text">未读取文件、历史业务背景、权限外系统、没有运行过的命令，都不能当成已确认事实。</text>
  <text x="118" y="806" class="small">工程控制点：要求读取记录、计划、diff、命令输出和剩余风险，而不是只听“已完成”。</text>
</svg>
