<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="arrow-end" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L11,6 z" fill="#475569"/>
    </marker>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="82" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#172033">从个人流程到团队化实战</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="19" fill="#64748b">个人先跑通边界、上下文、验证和沉淀，团队再统一产物、证据和协作</text>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="185" width="410" height="540" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <rect x="112" y="218" width="170" height="44" rx="22" fill="#0f766e"/>
    <text x="197" y="247" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">个人日常工程</text>
    <text x="116" y="296" font-size="18" fill="#475569">先让一个程序员稳定完成真实需求</text>

    <rect x="120" y="335" width="330" height="58" rx="12" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="150" y="371" font-size="21" font-weight="700" fill="#155e75">任务边界</text>
    <text x="275" y="371" font-size="17" fill="#475569">目标、非目标、风险</text>

    <rect x="120" y="415" width="330" height="58" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="150" y="451" font-size="21" font-weight="700" fill="#166534">上下文包</text>
    <text x="275" y="451" font-size="17" fill="#475569">入口、测试、相似实现</text>

    <rect x="120" y="495" width="330" height="58" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="150" y="531" font-size="21" font-weight="700" fill="#9a3412">小 diff</text>
    <text x="275" y="531" font-size="17" fill="#475569">分步授权、及时审查</text>

    <rect x="120" y="575" width="330" height="58" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="150" y="611" font-size="21" font-weight="700" fill="#991b1b">验证证据</text>
    <text x="275" y="611" font-size="17" fill="#475569">测试、页面、接口、ledger</text>

    <rect x="595" y="185" width="410" height="540" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <rect x="627" y="218" width="170" height="44" rx="22" fill="#2563eb"/>
    <text x="712" y="247" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">可共享资产</text>
    <text x="631" y="296" font-size="18" fill="#475569">把一次有效经验变成团队能复用的对象</text>

    <rect x="635" y="335" width="330" height="58" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="665" y="371" font-size="21" font-weight="700" fill="#1d4ed8">项目规则</text>
    <text x="790" y="371" font-size="17" fill="#475569">长期边界进仓库</text>

    <rect x="635" y="415" width="330" height="58" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="665" y="451" font-size="21" font-weight="700" fill="#4338ca">SPEC / 模板</text>
    <text x="815" y="451" font-size="17" fill="#475569">需求、设计、任务</text>

    <rect x="635" y="495" width="330" height="58" rx="12" fill="#fef9c3" stroke="#fde047"/>
    <text x="665" y="531" font-size="21" font-weight="700" fill="#854d0e">测试脚本</text>
    <text x="790" y="531" font-size="17" fill="#475569">把规则变成机器检查</text>

    <rect x="635" y="575" width="330" height="58" rx="12" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="665" y="611" font-size="21" font-weight="700" fill="#6b21a8">规则库</text>
    <text x="790" y="611" font-size="17" fill="#475569">少写、常删、可迁移</text>

    <rect x="1110" y="185" width="410" height="540" rx="18" fill="#ffffff" stroke="#cbd5e1" filter="url(#card-shadow)"/>
    <rect x="1142" y="218" width="170" height="44" rx="22" fill="#7c3aed"/>
    <text x="1227" y="247" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">团队化实战</text>
    <text x="1146" y="296" font-size="18" fill="#475569">让多人、多仓库、多工具仍然能协同</text>

    <rect x="1150" y="335" width="330" height="58" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1180" y="371" font-size="21" font-weight="700" fill="#5b21b6">共享运行时</text>
    <text x="1325" y="371" font-size="17" fill="#475569">状态、产物、工具</text>

    <rect x="1150" y="415" width="330" height="58" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="1180" y="451" font-size="21" font-weight="700" fill="#047857">有界上下文</text>
    <text x="1325" y="451" font-size="17" fill="#475569">给得准，不是给得多</text>

    <rect x="1150" y="495" width="330" height="58" rx="12" fill="#fff1f2" stroke="#fda4af"/>
    <text x="1180" y="531" font-size="21" font-weight="700" fill="#be123c">协作接管</text>
    <text x="1325" y="531" font-size="17" fill="#475569">artifact、diff、evidence</text>

    <rect x="1150" y="575" width="330" height="58" rx="12" fill="#fefce8" stroke="#facc15"/>
    <text x="1180" y="611" font-size="21" font-weight="700" fill="#a16207">验证治理</text>
    <text x="1325" y="611" font-size="17" fill="#475569">baseline、风险、恢复</text>

    <path d="M500 455 L585 455" stroke="#475569" stroke-width="5" marker-end="url(#arrow-end)"/>
    <path d="M1015 455 L1100 455" stroke="#475569" stroke-width="5" marker-end="url(#arrow-end)"/>
    <text x="523" y="425" font-size="18" font-weight="700" fill="#334155">抽象</text>
    <text x="1038" y="425" font-size="18" font-weight="700" fill="#334155">放大</text>

    <rect x="160" y="780" width="1280" height="62" rx="16" fill="#172033"/>
    <text x="800" y="819" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">不要跳步：个人流程没跑顺，平台化只会把边界、上下文和验证问题放大</text>
  </g>
</svg>
