<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">用 Superpowers / Skill 固化调试与评审纪律</text>
  <text x="80" y="124" font-family="Arial, sans-serif" font-size="18" fill="#64748b">把“先复现、再定位、后修复、再评审”的流程变成 Agent 可执行路线</text>

  <circle cx="790" cy="450" r="250" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="790" cy="450" r="150" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="704" y="440" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3730a3">真实任务</text>
  <text x="668" y="480" font-family="Arial, sans-serif" font-size="18" fill="#4f46e5">bug / diff / test failure</text>

  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="650" y="125" width="280" height="78" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="692" y="172" font-weight="700" fill="#155e75">systematic-debugging</text>
    <rect x="1050" y="270" width="290" height="78" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="1098" y="317" font-weight="700" fill="#166534">test-driven-development</text>
    <rect x="1045" y="570" width="310" height="78" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="1088" y="617" font-weight="700" fill="#9a3412">requesting-code-review</text>
    <rect x="630" y="705" width="330" height="78" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="682" y="752" font-weight="700" fill="#991b1b">verification-before-completion</text>
    <rect x="240" y="570" width="300" height="78" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="288" y="617" font-weight="700" fill="#5b21b6">receiving-code-review</text>
    <rect x="245" y="270" width="290" height="78" rx="14" fill="#fefce8" stroke="#fde047"/>
    <text x="300" y="317" font-weight="700" fill="#854d0e">writing-plans</text>
  </g>

  <path d="M790 205 L790 300" stroke="#64748b" stroke-width="4" marker-end="url(#arrow3)"/>
  <path d="M1000 320 L910 380" stroke="#64748b" stroke-width="4" marker-end="url(#arrow3)"/>
  <path d="M1048 592 L935 525" stroke="#64748b" stroke-width="4" marker-end="url(#arrow3)"/>
  <path d="M792 705 L792 602" stroke="#64748b" stroke-width="4" marker-end="url(#arrow3)"/>
  <path d="M540 592 L650 525" stroke="#64748b" stroke-width="4" marker-end="url(#arrow3)"/>
  <path d="M535 320 L650 380" stroke="#64748b" stroke-width="4" marker-end="url(#arrow3)"/>

  <rect x="130" y="760" width="1320" height="82" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="170" y="810" font-family="Arial, sans-serif" font-size="20" fill="#374151">核心不是多装几个 Skill，而是让每个 Skill 只在明确任务里触发，并要求留下复现、测试、review 和验证证据。</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
