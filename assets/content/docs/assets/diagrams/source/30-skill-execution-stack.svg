<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .layer { filter: url(#shadow); stroke-width: 2; }
      .label { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 20px "SFMono-Regular", Menlo, Consolas, monospace; fill: #7c2d12; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">Skill 不是单层指令，而是执行栈</text>
  <text x="82" y="128" class="subtitle">越靠下越确定，越靠上越需要模型判断；好的 Skill 会把关键检查下沉到脚本和命令。</text>

  <rect x="310" y="610" width="980" height="100" rx="16" fill="#ecfdf5" stroke="#86efac" class="layer"/>
  <text x="360" y="672" class="label">验证命令 / 脚本输出</text>
  <text x="880" y="672" class="mono">npm test / node scripts/check.js</text>

  <rect x="260" y="490" width="1080" height="100" rx="16" fill="#eff6ff" stroke="#93c5fd" class="layer"/>
  <text x="310" y="552" class="label">参考资料和模板</text>
  <text x="850" y="552" class="small">checklist、examples、schema</text>

  <rect x="210" y="370" width="1180" height="100" rx="16" fill="#fefce8" stroke="#fde68a" class="layer"/>
  <text x="260" y="432" class="label">Skill 流程</text>
  <text x="850" y="432" class="small">步骤、禁区、输出格式</text>

  <rect x="160" y="250" width="1280" height="100" rx="16" fill="#f5f3ff" stroke="#c4b5fd" class="layer"/>
  <text x="210" y="312" class="label">项目规则和当前任务</text>
  <text x="850" y="312" class="small">repo 命令、当前授权、需求范围</text>

  <rect x="110" y="130" width="1380" height="100" rx="16" fill="#ffffff" stroke="#fed7aa" class="layer"/>
  <text x="160" y="192" class="label">模型推理</text>
  <text x="850" y="192" class="small">理解、选择、取舍、解释</text>

  <text x="395" y="790" class="small">经验判断：能用脚本检查的，不要只靠模型自觉；必须人工取舍的，要让模型说明证据。</text>
</svg>
