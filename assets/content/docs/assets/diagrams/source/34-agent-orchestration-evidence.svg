<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .main { fill: #ffffff; stroke: #ddd6fe; stroke-width: 2; filter: url(#shadow); }
      .agent { fill: #f8fafc; stroke: #c4b5fd; stroke-width: 2; filter: url(#shadow); }
      .ledger { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 17px "SFMono-Regular", Menlo, Consolas, monospace; fill: #5b21b6; }
      .edge { stroke: #7c3aed; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .return { stroke: #16a34a; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">多 Agent 的合并责任</text>
  <text x="82" y="128" class="subtitle">子 Agent 可以分头探索，但主 Agent 必须汇总证据、解决冲突、决定是否改代码。</text>

  <rect x="95" y="345" width="280" height="210" rx="20" class="main"/>
  <text x="132" y="410" class="label">主 Agent</text>
  <text x="132" y="455" class="small">拆任务</text>
  <text x="132" y="492" class="small">定义输出格式</text>
  <text x="132" y="529" class="small">最终决策</text>

  <rect x="520" y="210" width="260" height="155" rx="18" class="agent"/>
  <text x="555" y="265" class="label">Agent A</text>
  <text x="555" y="307" class="small">搜索调用链</text>

  <rect x="520" y="410" width="260" height="155" rx="18" class="agent"/>
  <text x="555" y="465" class="label">Agent B</text>
  <text x="555" y="507" class="small">检查测试缺口</text>

  <rect x="520" y="610" width="260" height="155" rx="18" class="agent"/>
  <text x="555" y="665" class="label">Agent C</text>
  <text x="555" y="707" class="small">审查安全风险</text>

  <rect x="945" y="290" width="270" height="280" rx="20" class="main"/>
  <text x="985" y="352" class="label">结果合并</text>
  <text x="985" y="398" class="small">去重</text>
  <text x="985" y="435" class="small">冲突处理</text>
  <text x="985" y="472" class="small">证据分级</text>
  <text x="985" y="509" class="small">人工确认点</text>

  <rect x="1320" y="330" width="215" height="205" rx="20" class="ledger"/>
  <text x="1355" y="392" class="label">可交付结果</text>
  <text x="1355" y="438" class="small">小 diff</text>
  <text x="1355" y="475" class="small">验证命令</text>
  <text x="1355" y="512" class="small">残余风险</text>

  <path d="M375 420 C430 350, 455 290, 520 287" class="edge"/>
  <path d="M375 450 C430 470, 455 487, 520 487" class="edge"/>
  <path d="M375 480 C430 575, 455 685, 520 687" class="edge"/>
  <path d="M780 287 C850 315, 890 350, 945 382" class="return"/>
  <path d="M780 487 C850 465, 890 445, 945 430" class="return"/>
  <path d="M780 687 C855 620, 900 540, 945 495" class="return"/>
  <path d="M1215 430 C1260 430, 1280 430, 1320 430" class="edge"/>
</svg>
