<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .bad { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; }
      .good { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; }
      .label { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 20px "SFMono-Regular", Menlo, Consolas, monospace; fill: #1e293b; }
      .x { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #b91c1c; }
      .ok { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #15803d; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">失败测试也要审质量</text>
  <text x="82" y="128" class="subtitle">TDD 的关键不是先写测试，而是先写能约束行为的测试。</text>

  <rect x="90" y="205" width="675" height="560" rx="18" class="panel"/>
  <text x="135" y="265" class="label">不合格测试</text>
  <rect x="135" y="320" width="580" height="78" rx="12" class="bad"/>
  <text x="165" y="368" class="x">×</text>
  <text x="205" y="368" class="small">只断言函数被调用，不断言业务结果</text>
  <rect x="135" y="420" width="580" height="78" rx="12" class="bad"/>
  <text x="165" y="468" class="x">×</text>
  <text x="205" y="468" class="small">为了通过实现而改弱断言</text>
  <rect x="135" y="520" width="580" height="78" rx="12" class="bad"/>
  <text x="165" y="568" class="x">×</text>
  <text x="205" y="568" class="small">只覆盖 happy path，不覆盖幂等和失败</text>
  <rect x="135" y="620" width="580" height="78" rx="12" class="bad"/>
  <text x="165" y="668" class="x">×</text>
  <text x="205" y="668" class="small">失败原因和目标需求无关</text>

  <rect x="835" y="205" width="675" height="560" rx="18" class="panel"/>
  <text x="880" y="265" class="label">合格测试</text>
  <rect x="880" y="320" width="580" height="78" rx="12" class="good"/>
  <text x="910" y="368" class="ok">✓</text>
  <text x="950" y="368" class="small">断言状态、幂等、外部副作用</text>
  <rect x="880" y="420" width="580" height="78" rx="12" class="good"/>
  <text x="910" y="468" class="ok">✓</text>
  <text x="950" y="468" class="small">实现前稳定失败，旧行为测试通过</text>
  <rect x="880" y="520" width="580" height="78" rx="12" class="good"/>
  <text x="910" y="568" class="ok">✓</text>
  <text x="950" y="568" class="small">覆盖 happy path、重复请求、失败回滚</text>
  <rect x="880" y="620" width="580" height="78" rx="12" class="good"/>
  <text x="910" y="668" class="ok">✓</text>
  <text x="950" y="668" class="small">测试名能对应 requirement 或 scenario</text>

  <text x="555" y="820" class="mono">先审测试，再授权实现。</text>
</svg>
