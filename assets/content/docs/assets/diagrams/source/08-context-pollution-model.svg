<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #bfdbfe; stroke-width: 2; filter: url(#shadow); }
      .bad { fill: #fee2e2; stroke: #fca5a5; stroke-width: 2; filter: url(#shadow); }
      .clean { fill: #dcfce7; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .agent { fill: #1e3a8a; filter: url(#shadow); }
      .nodeTitle { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .badText { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #7f1d1d; }
      .agentTitle { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .agentText { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dbeafe; }
      .line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .badLine { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrowRed); stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">上下文污染和清理机制</text>
  <text x="82" y="128" class="subtitle">同一窗口里的旧猜测、过期文档和无关文件，会和真实证据一起影响 Agent。</text>

  <rect x="120" y="210" width="300" height="120" rx="18" class="node"/>
  <text x="166" y="258" class="nodeTitle">当前任务</text>
  <text x="166" y="296" class="text">目标、约束、完成判断</text>

  <rect x="120" y="390" width="300" height="120" rx="18" class="node"/>
  <text x="166" y="438" class="nodeTitle">真实证据</text>
  <text x="166" y="476" class="text">源码、测试、命令输出</text>

  <rect x="120" y="570" width="300" height="120" rx="18" class="bad"/>
  <text x="166" y="618" class="nodeTitle">污染源</text>
  <text x="166" y="656" class="badText">旧假设、过期文档、无关代码</text>

  <rect x="620" y="330" width="360" height="210" rx="28" class="agent"/>
  <text x="704" y="412" class="agentTitle">Coding Agent</text>
  <text x="676" y="456" class="agentText">基于当前可见材料</text>
  <text x="686" y="494" class="agentText">生成下一步行动</text>

  <rect x="1180" y="250" width="300" height="120" rx="18" class="bad"/>
  <text x="1226" y="298" class="nodeTitle">偏航输出</text>
  <text x="1226" y="336" class="badText">改错文件、扩大范围</text>

  <rect x="1180" y="520" width="300" height="120" rx="18" class="clean"/>
  <text x="1226" y="568" class="nodeTitle">清理后输出</text>
  <text x="1226" y="606" class="text">事实、假设、下一步动作</text>

  <path d="M 420 270 C 500 300, 560 350, 620 386" class="line"/>
  <path d="M 420 450 C 510 445, 560 440, 620 430" class="line"/>
  <path d="M 420 630 C 520 600, 570 535, 620 492" class="badLine"/>
  <path d="M 980 410 C 1060 370, 1120 330, 1180 310" class="badLine"/>
  <path d="M 980 480 C 1060 520, 1120 560, 1180 580" class="line"/>

  <rect x="560" y="715" width="520" height="82" rx="18" class="clean"/>
  <text x="604" y="766" class="text">清理动作：已确认事实 / 已排除假设 / 未验证假设 / 硬约束 / 最小验证动作。</text>
</svg>
