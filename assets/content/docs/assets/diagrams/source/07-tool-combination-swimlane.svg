<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .laneLabel { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .stepTitle { font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .card { fill: #eef2ff; stroke: #a5b4fc; stroke-width: 2; filter: url(#shadow); }
      .card2 { fill: #ecfeff; stroke: #67e8f9; stroke-width: 2; filter: url(#shadow); }
      .card3 { fill: #fef3c7; stroke: #fbbf24; stroke-width: 2; filter: url(#shadow); }
      .card4 { fill: #dcfce7; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .line { stroke: #4f46e5; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">App、CLI、IDE 切换完成一次真实改动</text>
  <text x="82" y="128" class="subtitle">先选主工作面；需要切换时，用任务卡、diff 和验证结果交接。</text>

  <rect x="160" y="180" width="1300" height="140" rx="18" class="lane"/>
  <rect x="160" y="340" width="1300" height="140" rx="18" class="lane"/>
  <rect x="160" y="500" width="1300" height="140" rx="18" class="lane"/>
  <rect x="160" y="660" width="1300" height="140" rx="18" class="lane"/>

  <text x="60" y="260" class="laneLabel">App</text>
  <text x="62" y="420" class="laneLabel">CLI</text>
  <text x="64" y="580" class="laneLabel">IDE</text>
  <text x="34" y="740" class="laneLabel">Browser</text>

  <rect x="220" y="210" width="230" height="84" rx="14" class="card"/>
  <text x="250" y="246" class="stepTitle">任务分级</text>
  <text x="250" y="276" class="text">风险、约束、授权级别</text>

  <rect x="510" y="370" width="230" height="84" rx="14" class="card2"/>
  <text x="540" y="406" class="stepTitle">仓库侦察</text>
  <text x="540" y="436" class="text">搜索、读文件、计划</text>

  <rect x="800" y="370" width="230" height="84" rx="14" class="card2"/>
  <text x="830" y="406" class="stepTitle">失败测试</text>
  <text x="830" y="436" class="text">先锁住回归路径</text>

  <rect x="800" y="530" width="230" height="84" rx="14" class="card3"/>
  <text x="830" y="566" class="stepTitle">局部实现</text>
  <text x="830" y="596" class="text">选区或相邻文件</text>

  <rect x="1090" y="370" width="230" height="84" rx="14" class="card2"/>
  <text x="1120" y="406" class="stepTitle">命令验证</text>
  <text x="1120" y="436" class="text">test、typecheck、diff</text>

  <rect x="1090" y="690" width="230" height="84" rx="14" class="card4"/>
  <text x="1120" y="726" class="stepTitle">页面路径</text>
  <text x="1120" y="756" class="text">操作、Network、截图</text>

  <rect x="1280" y="210" width="150" height="84" rx="14" class="card"/>
  <text x="1308" y="246" class="stepTitle">收口</text>
  <text x="1308" y="276" class="text">报告和风险</text>

  <path d="M 450 252 C 480 300, 500 340, 510 402" class="line"/>
  <path d="M 740 412 L 800 412" class="line"/>
  <path d="M 915 454 L 915 530" class="line"/>
  <path d="M 1030 572 C 1070 530, 1085 480, 1090 426" class="line"/>
  <path d="M 1205 454 L 1205 690" class="line"/>
  <path d="M 1320 732 C 1400 650, 1405 350, 1355 294" class="line"/>
</svg>
