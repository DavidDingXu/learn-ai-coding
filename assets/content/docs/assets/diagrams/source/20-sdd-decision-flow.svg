<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .choice { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; filter: url(#shadow); }
      .result1 { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; filter: url(#shadow); }
      .result2 { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; filter: url(#shadow); }
      .result3 { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 26px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .edge { stroke: #ea580c; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .edgeText { font: 700 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #9a3412; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">选型流程：先问工程问题，再选工具</text>
  <text x="82" y="128" class="subtitle">不要因为工具更完整就默认上框架，也不要因为怕麻烦而丢掉规格资产。</text>

  <rect x="560" y="185" width="480" height="92" rx="18" class="choice"/>
  <text x="612" y="242" class="label">这次变更会改变长期行为合同吗？</text>

  <rect x="205" y="355" width="410" height="140" rx="18" class="result1"/>
  <text x="248" y="410" class="label">否：轻量 SDD</text>
  <text x="248" y="452" class="small">临时规格 + 小步任务 + 验证记录</text>

  <rect x="790" y="345" width="490" height="92" rx="18" class="choice"/>
  <text x="835" y="402" class="label">是否已有系统行为需要作为 source of truth？</text>

  <rect x="760" y="550" width="430" height="145" rx="18" class="result2"/>
  <text x="805" y="605" class="label">是：OpenSpec</text>
  <text x="805" y="647" class="small">specs 记录当前行为，changes 管拟议变更</text>

  <rect x="1200" y="550" width="330" height="145" rx="18" class="result3"/>
  <text x="1240" y="605" class="label">否：Spec Kit</text>
  <text x="1240" y="647" class="small">从 constitution 到 implement</text>

  <rect x="1200" y="325" width="330" height="105" rx="18" class="choice"/>
  <text x="1235" y="365" class="label">需要多工具集成</text>
  <text x="1235" y="403" class="label">和完整 SDD 流程吗？</text>

  <path d="M 650 277 C 520 300, 450 325, 410 355" class="edge"/>
  <text x="480" y="330" class="edgeText">不改变</text>

  <path d="M 960 277 C 1015 300, 1030 318, 1035 345" class="edge"/>
  <text x="1038" y="320" class="edgeText">会改变</text>

  <path d="M 1035 437 C 1010 480, 990 515, 975 550" class="edge"/>
  <text x="995" y="505" class="edgeText">有存量合同</text>

  <path d="M 1180 392 C 1220 390, 1235 388, 1265 385" class="edge"/>
  <text x="1186" y="365" class="edgeText">不确定</text>

  <path d="M 1365 430 C 1365 480, 1365 510, 1365 550" class="edge"/>
  <text x="1380" y="505" class="edgeText">需要</text>

  <path d="M 1200 405 C 1070 475, 1010 515, 975 550" class="edge"/>
  <text x="1100" y="505" class="edgeText">不需要</text>
</svg>
