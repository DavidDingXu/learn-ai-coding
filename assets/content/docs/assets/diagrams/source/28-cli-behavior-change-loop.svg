<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f46e5"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #c7d2fe; stroke-width: 2; filter: url(#shadow); }
      .warn { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .edge { stroke: #4f46e5; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">CLI 行为改动也要按产品契约处理</text>
  <text x="82" y="128" class="subtitle">终端输出、退出码、错误信息、README 命令，都是用户能感知的界面。</text>

  <rect x="90" y="300" width="230" height="170" rx="18" class="node"/>
  <text x="122" y="355" class="label">现状截图</text>
  <text x="122" y="395" class="small">命令输出</text>
  <text x="122" y="430" class="small">退出码</text>

  <rect x="400" y="250" width="245" height="270" rx="18" class="warn"/>
  <text x="432" y="305" class="label">行为契约</text>
  <text x="432" y="345" class="small">参数怎么传</text>
  <text x="432" y="380" class="small">失败怎么报</text>
  <text x="432" y="415" class="small">输出能否解析</text>

  <rect x="725" y="300" width="230" height="170" rx="18" class="node"/>
  <text x="757" y="355" class="label">测试先行</text>
  <text x="757" y="395" class="small">锁定输出</text>
  <text x="757" y="430" class="small">覆盖错误路径</text>

  <rect x="1035" y="250" width="245" height="270" rx="18" class="node"/>
  <text x="1067" y="305" class="label">小步实现</text>
  <text x="1067" y="345" class="small">不改无关命令</text>
  <text x="1067" y="380" class="small">不吞错误</text>
  <text x="1067" y="415" class="small">README 同步</text>

  <rect x="1360" y="300" width="155" height="170" rx="18" class="node"/>
  <text x="1390" y="355" class="label">验证</text>
  <text x="1390" y="395" class="small">test</text>
  <text x="1390" y="430" class="small">手跑</text>

  <path d="M320 385 C355 385, 365 385, 400 385" class="edge"/>
  <path d="M645 385 C680 385, 690 385, 725 385" class="edge"/>
  <path d="M955 385 C1000 385, 1010 385, 1035 385" class="edge"/>
  <path d="M1280 385 C1320 385, 1330 385, 1360 385" class="edge"/>
</svg>
