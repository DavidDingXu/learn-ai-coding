<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0284c7"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { fill: #ffffff; stroke: #bae6fd; stroke-width: 2; filter: url(#shadow); }
      .gate { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; filter: url(#shadow); }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .mono { font: 700 17px "SFMono-Regular", Menlo, Consolas, monospace; fill: #075985; }
      .edge { stroke: #0284c7; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #f97316; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">自定义 Skill 的正确路线</text>
  <text x="82" y="128" class="subtitle">先从真实失败里提炼流程，再把流程压成可触发、可验证、可维护的能力。</text>

  <rect x="80" y="265" width="230" height="170" rx="18" class="node"/>
  <text x="112" y="320" class="label">反复失误</text>
  <text x="112" y="360" class="small">跳过测试</text>
  <text x="112" y="394" class="small">大 diff 失控</text>

  <rect x="380" y="235" width="245" height="230" rx="18" class="gate"/>
  <text x="412" y="290" class="label">压力场景</text>
  <text x="412" y="330" class="small">不用 Skill 先跑一次</text>
  <text x="412" y="365" class="small">记录 Agent 怎么偏</text>
  <text x="412" y="405" class="mono">baseline evidence</text>

  <rect x="705" y="235" width="245" height="230" rx="18" class="node"/>
  <text x="737" y="290" class="label">最小 Skill</text>
  <text x="737" y="330" class="small">触发条件</text>
  <text x="737" y="365" class="small">步骤和停止点</text>
  <text x="737" y="405" class="mono">SKILL.md</text>

  <rect x="1030" y="235" width="245" height="230" rx="18" class="node"/>
  <text x="1062" y="290" class="label">真实任务压测</text>
  <text x="1062" y="330" class="small">看是否按流程走</text>
  <text x="1062" y="365" class="small">看输出是否可审</text>
  <text x="1062" y="405" class="mono">diff + commands</text>

  <rect x="705" y="570" width="245" height="190" rx="18" class="node"/>
  <text x="737" y="625" class="label">沉淀资产</text>
  <text x="737" y="665" class="small">references</text>
  <text x="737" y="700" class="small">scripts</text>
  <text x="737" y="735" class="small">examples</text>

  <rect x="1030" y="570" width="245" height="190" rx="18" class="gate"/>
  <text x="1062" y="625" class="label">维护边界</text>
  <text x="1062" y="665" class="small">少写项目私货</text>
  <text x="1062" y="700" class="small">定期删过期规则</text>

  <path d="M310 350 C340 350, 350 350, 380 350" class="edge"/>
  <path d="M625 350 C660 350, 670 350, 705 350" class="edge"/>
  <path d="M950 350 C990 350, 1000 350, 1030 350" class="edge"/>
  <path d="M1152 465 C1152 515, 1152 530, 1152 570" class="edge"/>
  <path d="M1030 665 C1000 665, 985 665, 950 665" class="edge"/>
  <path d="M827 570 C827 520, 827 505, 827 465" class="edge"/>
  <path d="M1280 640 C1390 620, 1405 270, 1280 260" class="loop"/>
</svg>
