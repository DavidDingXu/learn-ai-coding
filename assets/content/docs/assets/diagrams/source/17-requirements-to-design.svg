<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
    <style>
      .title { font: 700 46px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .req { fill: #dbeafe; stroke: #93c5fd; stroke-width: 2; filter: url(#shadow); }
      .design { fill: #ffffff; stroke: #c4b5fd; stroke-width: 2; filter: url(#shadow); }
      .head { font: 700 25px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .text { font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .line { stroke: #4f46e5; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="86" class="title">requirements 到 design 的映射</text>
  <text x="82" y="128" class="subtitle">requirements 定义行为，design 把行为映射到当前代码结构和验证风险。</text>

  <rect x="110" y="230" width="390" height="150" rx="22" class="req"/>
  <text x="160" y="288" class="head">Acceptance Criteria</text>
  <text x="160" y="330" class="text">paid 订单取消进入 refund_requested</text>

  <rect x="110" y="500" width="390" height="150" rx="22" class="req"/>
  <text x="160" y="558" class="head">Out Of Scope</text>
  <text x="160" y="600" class="text">不改支付回调和历史数据</text>

  <rect x="650" y="150" width="390" height="130" rx="22" class="design"/>
  <text x="700" y="202" class="head">Current Flow</text>
  <text x="700" y="240" class="text">当前入口、服务、状态流转</text>

  <rect x="650" y="330" width="390" height="130" rx="22" class="design"/>
  <text x="700" y="382" class="head">Proposed Change</text>
  <text x="700" y="420" class="text">规则放在哪一层，为什么</text>

  <rect x="650" y="510" width="390" height="130" rx="22" class="design"/>
  <text x="700" y="562" class="head">Compatibility</text>
  <text x="700" y="600" class="text">接口、状态、错误码、历史行为</text>

  <rect x="650" y="690" width="390" height="130" rx="22" class="design"/>
  <text x="700" y="742" class="head">Verification Strategy</text>
  <text x="700" y="780" class="text">风险对应测试和检查</text>

  <rect x="1180" y="330" width="300" height="180" rx="24" class="design"/>
  <text x="1230" y="392" class="head">design.md</text>
  <text x="1230" y="434" class="text">技术合同</text>
  <text x="1230" y="470" class="text">防止补丁式实现</text>

  <path d="M 500 305 C 570 250, 600 220, 650 215" class="line"/>
  <path d="M 500 305 C 575 340, 600 375, 650 395" class="line"/>
  <path d="M 500 575 C 570 570, 600 575, 650 575" class="line"/>
  <path d="M 1040 395 L 1180 410" class="line"/>
  <path d="M 1040 575 C 1100 540, 1130 500, 1180 455" class="line"/>
</svg>
